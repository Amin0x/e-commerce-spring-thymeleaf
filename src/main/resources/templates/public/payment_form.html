<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Your page description here">
    <meta name="author" content="Your name or company">
    <!-- Title -->
    <title th:text="${title}">Your Title Here</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/public/css/style.css}" href="../../static/public/css/style.css" rel="stylesheet">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>

<body class="bg-[#3ecc6d] min-h-screen p-4 font-sans">
    <div class="container mx-auto max-w-2xl rounded-lg shadow-lg bg-white p-6">
        <div class="card box1 max-w-sm mx-auto shadow-sm p-6">
            <div class="fw-bolder mb-4 text-2xl font-bold">
                <span class="fas fa-dollar-sign text-[#57c97d]"></span>
                <span class="ps-1 font-semibold" th:text="${amount}">599,00</span>
            </div>
            <div class="d-flex flex-column text-sm text-gray-700">
                <div class="d-flex align-items-center justify-content-between mb-1">
                    <span>Commission</span>
                    <span class="fas fa-dollar-sign text-[#57c97d]">
                        <span class="ps-1 font-semibold" th:text="${commission}">1.99</span>
                    </span>
                </div>
                <div class="d-flex align-items-center justify-content-between text mb-4">
                    <span>Total</span>
                    <span class="fas fa-dollar-sign text-[#57c97d]">
                        <span class="ps-1 font-semibold" th:text="${total}">600.99</span>
                    </span>
                </div>
                <div class="border-b border-gray-300 mb-4"></div>
                <div class="d-flex flex-column mb-4">
                    <span class="far fa-file-alt text">
                        <span class="ps-2 font-semibold">Invoice ID:</span>
                    </span>
                    <span class="ps-3 font-semibold" th:text="${invoiceId}">SN8478042099</span>
                </div>
                <div class="d-flex flex-column mb-5">
                    <span class="far fa-calendar-alt text">
                        <span class="ps-2 font-semibold">Next payment:</span>
                    </span>
                    <span class="ps-3 font-semibold" th:text="${nextPayment}">22 july,2018</span>
                </div>
                <div class="d-flex align-items-center justify-content-between mt-5">
                    <div class="d-flex flex-column text-sm">
                        <span class="font-semibold">Customer Support:</span>
                        <span class="text-gray-500">online chat 24/7</span>
                    </div>
                    <div class="btn btn-primary rounded-full p-2">
                        <span class="fas fa-comment-alt"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card box-round shadow-sm mt-6">
            <div class="d-flex align-items-center justify-content-between p-4">
                <span class="text-lg font-bold">Payment methods</span>
                <div class="btn btn-primary p-2">
                    <span class="fas fa-bars"></span>
                </div>
            </div>
            <ul class="nav nav-tabs mb-3 border-b border-gray-300 p-4">
                <li class="nav-item">
                    <a class="nav-link px-2 active border-b-2 border-[#3ecc6d]" aria-current="page" href="#">Credit Card</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2 text-gray-600 hover:text-blue-600" href="#">Mobile Payment</a>
                </li>
                <li class="nav-item ms-auto">
                    <a class="nav-link px-2 text-gray-600 hover:text-blue-600" href="#">+ More</a>
                </li>
            </ul>
            <div class="px-4 mb-4 d-flex align-items-center gap-2">
                <div class="btn btn-success p-2">
                    <span class="fas fa-plus"></span>
                </div>
                <div class="btn-group flex gap-2" role="group" aria-label="Basic radio toggle button group">
                    <input type="radio" class="btn-check hidden" name="btnradio" id="btnradio1" autocomplete="off" checked>
                    <label class="btn btn-outline-primary px-4 py-1" for="btnradio1">
                        <span class="pe-1 font-semibold" th:text="${amount1}">+5949</span>
                    </label>
                    <input type="radio" class="btn-check hidden" name="btnradio" id="btnradio2" autocomplete="off">
                    <label class="btn btn-outline-primary px-4 py-1" for="btnradio2">
                        <span class="lpe-1 font-semibold" th:text="${amount2}">+3894</span>
                    </label>
                </div>
            </div>
            <form action="/payments" method="post" name="payment-form">
                <div class="space-y-4 p-4">
                    <div class="d-flex flex-column">
                        <span class="font-semibold text-gray-700">Credit Card</span>
                        <div class="inputWithIcon relative mt-2">
                            <input class="form-control w-full" type="text" th:value="${cardNumber}"> <!-- Dynamic card number -->
                            <span class="absolute right-0 bottom-2 text-[#57c97d] cursor-pointer">
                                <img src="https://www.freepnglogos.com/uploads/mastercard-png/mastercard-logo-logok-15.png" alt="" class="w-6 h-6">
                            </span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="d-flex flex-column">
                            <span class="font-semibold text-gray-700">Expiration<span class="ps-1">Date</span></span>
                            <div class="inputWithIcon relative mt-2">
                                <input type="text" class="form-control w-full" th:value="${expiryDate}"> <!-- Expiry date -->
                                <span class="fas fa-calendar-alt absolute right-0 bottom-2 text-gray-400"></span>
                            </div>
                        </div>
                        <div class="d-flex flex-column">
                            <span class="font-semibold text-gray-700">Code CVV</span>
                            <div class="inputWithIcon relative mt-2">
                                <input type="password" class="form-control w-full" th:value="${cvvCode}"> <!-- CVV code -->
                                <span class="fas fa-lock absolute right-0 bottom-2 text-gray-400"></span>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex flex-column">
                        <span class="font-semibold text-gray-700">Name</span>
                        <div class="inputWithIcon relative mt-2">
                            <input class="form-control text-uppercase w-full" type="text" th:value="${name}"> <!-- User Name -->
                            <span class="far fa-user absolute right-0 bottom-2 text-gray-400"></span>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="button" class="btn btn-primary w-full py-2 font-semibold" onClick="document.forms['payment-form'].submit();">
                            <span th:text="'Pay $' + ${amount}">Pay $599.00</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
