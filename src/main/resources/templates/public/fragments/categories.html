<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories Fragment</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
</head>
<body>
<section th:if="${#lists.isEmpty(categories) == false}" th:fragment="categories" class="categories px-4 py-8">
    <div class="header flex justify-between items-center mb-6">
        <h2 class="header__title text-xl font-bold text-gray-900">التصنيفات</h2>
        <a class="header__link text-blue-600 hover:underline text-sm font-medium" th:href="@{/categories}" href="#">عرض الكل</a>
    </div>
    <div class="category-wrp grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
        <div class="category" th:each="category : ${categories}">
            <div class="category-card card p-2 text-center group">
                <div class="category-img mb-2">
                    <a th:href="${category.slug}" href="#" class="block">
                        <img th:src="${category.imageUrl}" class="card-img w-full h-32 object-cover mx-auto rounded" th:alt="${category.name}" src="../../../static/public/imgs/default-image.png" alt="default-image">
                    </a>
                </div>
                <div class="category-card__title">
                    <a th:href="${category.slug}" href="#" class="text-gray-900 group-hover:text-blue-600 transition-colors">
                        <p class="card-title text-sm font-medium" th:text="${category.name}">الخضروات والفواكه</p>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
