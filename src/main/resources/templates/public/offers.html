<!DOCTYPE html>
<html lang="en" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta th:content="${pageDescription}" name="description" content="Home page description for your website.">
    <meta th:content="${pageAuthor}" name="author" content="Your Name or Company Name">
    <meta th:content="${pageKeywords}" name="keywords" content="home, page, example, website">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>Document</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/public/css/style.css}" href="../../static/public/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div th:replace="public/fragments/navbar :: navbar"></div>
        <div class="content px-4 py-6 max-w-5xl mx-auto" id="content">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">العروض</h1>
            <div class="offers-container grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="offer card" th:each="offer : ${offers}">
                    <img th:src="${offer.imageUrl}" class="offer-img card-img-top w-full h-48 object-cover" alt="Offer Image">
                    <div class="offer-body card-body">
                        <h5 class="title font-semibold text-gray-800" th:text="${offer.title}">Offer Title</h5>
                        <p class="text text-gray-700 mb-4" th:text="${offer.description}">Offer Description</p>
                        <a th:href="@{/offer/{id}(id=${offer.id})}" class="offer-button btn btn-primary block text-center">View Details</a>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="public/fragments/footer :: footer"></div>
    </div>
</body>
</html>
