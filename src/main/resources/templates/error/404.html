<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="Home page" th:content="${description}">
    <meta name="author" content="Your Name" th:content="${author}">
    <meta name="keywords" content="home" th:content="${keywords}">

    <title th:text="${title}">404 Not Found</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="../../static/public/css/style.css" rel="stylesheet" >
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <main class="wrapper max-w-md">
        <section class="">
            <div class="container">
                <h1 class="text-6xl font-bold text-gray-900 mb-2">404</h1>
                <p class="text-xl text-gray-800 mb-4">Not Found</p>
                <p class="text-gray-600 mb-8">The page you are looking for does not exist.</p>
                <p><a href="/" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors font-medium"><i class="fas fa-home mr-2"></i>Go to Home Page</a></p>
            </div>
        </section>
    </main>
</body>
</html>
