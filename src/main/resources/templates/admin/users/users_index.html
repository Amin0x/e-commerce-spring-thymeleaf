<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${pageTitle}">User Dashboard</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../../static/admin/main.css" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <div class="wrapper p-6">
            <aside th:replace="~{admin/fragments/navigation :: navigation}"></aside>
            <main class="content">
                <header th:replace="~{admin/fragments/header :: header}"></header>
                <div class="user-index-container">
                    <h1 class="page-title text-2xl font-bold text-gray-900 mb-6">Users home</h1>
                    <div class="users-counters grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="counter-card">
                            <div class="card bg-white border border-gray-200 rounded p-4 shadow-sm">
                                <div class="title text-sm font-medium text-gray-600"><span>Total Users</span></div>
                                <div class="body mt-2">
                                    <h5 class="text-xl font-bold text-gray-900" th:text="${totalUsers}"></h5>
                                </div>
                            </div>
                        </div>
                        <div class="counter-card">
                            <div class="card bg-white border border-gray-200 rounded p-4 shadow-sm">
                                <div class="title text-sm font-medium text-gray-600">Active Users</div>
                                <div class="body mt-2">
                                    <h5 class="text-xl font-bold text-gray-900" th:text="${activeUsers}"></h5>
                                </div>
                            </div>
                        </div>
                        <div class="counter-card">
                            <div class="card bg-white border border-gray-200 rounded p-4 shadow-sm">
                                <div class="title text-sm font-medium text-gray-600">New Users</div>
                                <div class="body mt-2">
                                    <h5 class="text-xl font-bold text-gray-900" th:text="${newUsers}"></h5>
                                </div>
                                <div class="text-xs text-gray-500 mt-1">this month</div>
                            </div>
                        </div>
                        <div class="counter-card">
                            <div class="card bg-white border border-gray-200 rounded p-4 shadow-sm">
                                <div class="title text-sm font-medium text-gray-600">Inactive Users</div>
                                <div class="body mt-2">
                                    <h5 class="text-xl font-bold text-gray-900" th:text="${inactiveUsers}"></h5>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="container-user-chart mt-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="chart-users-reg box-round bg-white border border-gray-200 rounded p-4 shadow-sm">
                            <div class="mb-4 flex items-center gap-4 justify-between">
                                <div class="title flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-plus text-blue-600" viewBox="0 0 16 16">
                                    <path d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H1s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C9.516 10.68 8.289 10 6 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
                                    <path fill-rule="evenodd" d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5"/>
                                </svg> <span class="text-sm font-semibold text-gray-800">User Registration</span></div>
                            </div>
                            <canvas id="usersRegistrationChart" class="w-full h-48"></canvas>
                        </div>
                        <div class="chart-users-reg box-round bg-white border border-gray-200 rounded p-4 shadow-sm">
                            <div class="mb-4 flex items-center gap-4 justify-between">
                                <div class="title flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-check text-blue-600" viewBox="0 0 16 16">
                                    <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m1.679-4.493-1.335 2.226a.75.75 0 0 1-1.174.144l-.774-.773a.5.5 0 0 1 .708-.708l.547.548 1.17-1.951a.5.5 0 1 1 .858.514M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4"/>
                                    <path d="M8.256 14a4.5 4.5 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10q.39 0 .74.025c.226-.341.496-.65.804-.918Q8.844 9.002 8 9c-5 0-6 3-6 4s1 1 1 1z"/>
                                </svg><span class="text-sm font-semibold text-gray-800">User Visits</span></div>
                            </div>
                            <canvas id="driversRegistrationChart" class="w-full h-48"></canvas>
                        </div>
                    </div>
                    <section class="top-users box-round mt-8 bg-white border border-gray-200 rounded p-4 shadow-sm">
                        <div class="mb-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                            <div class="card-title flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-stickies text-blue-600" viewBox="0 0 16 16">
                                <path d="M1.5 0A1.5 1.5 0 0 0 0 1.5V13a1 1 0 0 0 1 1V1.5a.5.5 0 0 1 .5-.5H14a1 1 0 0 0-1-1z"/>
                                <path d="M3.5 2A1.5 1.5 0 0 0 2 3.5v11A1.5 1.5 0 0 0 3.5 16h6.086a1.5 1.5 0 0 0 1.06-.44l4.915-4.914A1.5 1.5 0 0 0 16 9.586V3.5A1.5 1.5 0 0 0 14.5 2zM3 3.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 .5.5V9h-4.5A1.5 1.5 0 0 0 9 10.5V15H3.5a.5.5 0 0 1-.5-.5zm7 11.293V10.5a.5.5 0 0 1 .5-.5h4.293z"/>
                            </svg> <span class="text-sm font-semibold text-gray-800">New Users This Month</span></div>
                            <div><a th:href="@{/admin/users/all}" class="text-blue-600 hover:underline text-sm font-medium">View All</a></div>
                        </div>
                        <div th:if="${#lists.isEmpty(newUsersList) != true}">
                            <table class="table table-bordered w-full text-left">
                                <thead>
                                    <tr class="border-b border-gray-200">
                                        <th class="px-4 py-2 text-sm font-semibold text-gray-600">Name</th>
                                        <th class="px-4 py-2 text-sm font-semibold text-gray-600">User ID</th>
                                        <th class="px-4 py-2 text-sm font-semibold text-gray-600">Email</th>
                                        <th class="px-4 py-2 text-sm font-semibold text-gray-600">Registration Date</th>
                                        <th class="px-4 py-2 text-sm font-semibold text-gray-600">Update Date</th>
                                        <th class="px-4 py-2 text-sm font-semibold text-gray-600">Active Date</th>
                                        <th class="px-4 py-2 text-sm font-semibold text-gray-600">Role</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${newUsersList}" class="border-b border-gray-100 last:border-b-0 hover:bg-gray-50">
                                        <td class="px-4 py-2 text-sm">
                                            <a th:href="${'/admin/users/' + user.id }" class="text-blue-600 hover:underline" th:text="${user.firstName} + ' ' + ${user.lastName}"></a>
                                        </td>
                                        <td class="px-4 py-2 text-sm" th:text="${user.username}"></td>
                                        <td class="px-4 py-2 text-sm" th:text="${user.email}"></td>
                                        <td class="px-4 py-2 text-sm" th:text="${#temporals.format(user.created, 'yyyy-MM-dd')}"></td>
                                        <td class="px-4 py-2 text-sm" th:text="${#temporals.format(user.updated, 'yyyy-MM-dd')}"></td>
                                        <td class="px-4 py-2 text-sm" th:text="${#temporals.format(user.lastActive, 'yyyy-MM-dd')}"></td>
                                        <td class="px-4 py-2 text-sm" th:text="${user.role}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:unless="${#lists.isEmpty(newUsersList)} != true"></div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        // Users Registration Chart (Monthly)
        var ctx1 = document.getElementById('usersRegistrationChart').getContext('2d');
        var usersRegistrationChart = new Chart(ctx1, {
            type: 'line',
            data: {
                labels: [[${ usersRegistrationLabels }]], // Dynamic labels (months)
                datasets: [{
                    label: 'Users Registration',
                    data: [[${ usersRegistrationData }]], // Dynamic data (user counts)
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 2,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Drivers Registration Chart (Monthly)
        var ctx2 = document.getElementById('driversRegistrationChart').getContext('2d');
        var driversRegistrationChart = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: [[${ driversRegistrationLabels }]], // Dynamic labels (months)
                datasets: [{
                    label: 'Drivers Registration',
                    data: [[${ driversRegistrationData }]], // Dynamic data (driver counts)
                    borderColor: 'rgba(255, 159, 64, 1)',
                    borderWidth: 2,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
