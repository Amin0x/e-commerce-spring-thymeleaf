<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${pageTitle}">User List</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../../static/admin/main.css" rel="stylesheet">
</head>
<body>
<div class="page-wrapper">
    <div class="wrapper p-6">
        <aside th:replace="~{admin/fragments/navigation :: navigation}"></aside>
        <main class="content">
            <header th:replace="~{admin/fragments/header :: header}"></header>
        <div class="users-list-wrapper">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">User List</h1>
            <!-- Filter Form -->
            <form method="get" th:action="@{/admin/users/all?search}" class="mb-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 items-end">
                <div>
                    <input type="text" class="form-control w-full px-3 py-2 border border-gray-300 rounded" placeholder="First Name" name="firstName">
                </div>
                <div>
                    <input type="text" class="form-control w-full px-3 py-2 border border-gray-300 rounded" placeholder="Last Name" name="lastName">
                </div>
                <div>
                    <select class="form-control w-full px-3 py-2 border border-gray-300 rounded" name="role">
                        <option value="">Select Role</option>
                        <option value="ADMIN" th:selected="${role == 'ADMIN'}">Admin</option>
                        <option value="USER" th:selected="${role == 'USER'}">User</option>
                        <option value="GUEST" th:selected="${role == 'GUEST'}">Guest</option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="btn btn-primary w-full px-4 py-2">Filter</button>
                </div>
            </form>
            <div class="overflow-x-auto">
            <table class="table table-striped table-bordered w-full text-left">
                <thead>
                <tr class="border-b border-gray-200">
                    <th class="px-4 py-2 text-sm font-semibold text-gray-600">#</th>
                    <th class="px-4 py-2 text-sm font-semibold text-gray-600">First Name</th>
                    <th class="px-4 py-2 text-sm font-semibold text-gray-600">Last Name</th>
                    <th class="px-4 py-2 text-sm font-semibold text-gray-600">Role</th>
                    <th class="px-4 py-2 text-sm font-semibold text-gray-600">Registration Date</th>
                    <th class="px-4 py-2 text-sm font-semibold text-gray-600">Status</th>
                    <th class="px-4 py-2 text-sm font-semibold text-gray-600">Enabled</th>
                    <th class="px-4 py-2 text-sm font-semibold text-gray-600">Last Active</th>
                    <th class="px-4 py-2 text-sm font-semibold text-gray-600">Actions</th>
                </tr>
                </thead>
                <tbody>
                <!-- Iterate through the list of users -->
                <tr th:each="user : ${users}" class="border-b border-gray-100 last:border-b-0 hover:bg-gray-50">
                    <td class="px-4 py-2 text-sm" th:text="${user.id}"></td>
                    <td class="px-4 py-2 text-sm" th:text="${user.firstName}"></td>
                    <td class="px-4 py-2 text-sm" th:text="${user.lastName}"></td>
                    <td class="px-4 py-2 text-sm" th:text="${user.role}"></td>
                    <td class="px-4 py-2 text-sm" th:text="${#temporals.format(user.created, 'yyyy-MM-dd')}"></td>
                    <td class="px-4 py-2 text-sm"><span th:text="${user.status}"></span></td>
                    <td class="px-4 py-2 text-sm"><span th:text="${user.enabled}"></span></td>
                    <td class="px-4 py-2 text-sm" th:text="${#temporals.format(user.lastActive, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td class="px-4 py-2 text-sm">
                        <a href="#" th:href="@{'/admin/users/' + ${user.id}}" class="btn btn-info btn-sm px-3 py-1 text-xs">View</a>
                        <a href="#" th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-warning btn-sm px-3 py-1 text-xs">Edit</a>
                        <button type="submit" class="btn btn-danger btn-sm px-3 py-1 text-xs" th:data-delete-user="${user.id}">Delete</button>
                    </td>
                </tr>
                </tbody>
            </table>
            </div>

            <!-- Pagination -->

            <!--                </a>-->

        </div>
        </main>
    </div>
</div>

</body>
</html>
