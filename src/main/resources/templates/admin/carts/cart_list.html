<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Document</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper p-6"></div>
        <h2 class="mb-6 text-2xl font-bold text-gray-900">Carts List</h2>
        <div class="overflow-x-auto">
        <table id="cartsTable" class="w-full text-left border-collapse border border-gray-300" style="width:100%">
            <thead class="bg-gray-100">
                <tr>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Cart ID</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">User ID</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Total Items</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Total Price</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated here -->
            </tbody>
        </table>
        </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // Table initialized via JS; DataTables CSS/JS removed with Bootstrap migration
        });

        $.ajax({
            url: '/api/v1/carts',
            type: 'GET',
            success: function(response) {
                response.forEach(cart => {
                    $('#cartsTable tbody').append(`
                        <tr class="border-b border-gray-200 hover:bg-gray-50">
                            <td class="px-4 py-2 text-sm">${cart.id}</td>
                            <td class="px-4 py-2 text-sm">${cart.userId}</td>
                            <td class="px-4 py-2 text-sm">${cart.totalItems}</td>
                            <td class="px-4 py-2 text-sm">${cart.totalPrice}</td>
                            <td class="px-4 py-2 text-sm flex gap-2">
                                <a href="/admin/carts/${cart.id}" class="px-3 py-1 bg-blue-600 text-white rounded text-xs hover:bg-blue-700">View</a>
                                <a href="/admin/carts/${cart.id}/edit" class="px-3 py-1 bg-yellow-500 text-white rounded text-xs hover:bg-yellow-600">Edit</a>
                                <a href="/admin/carts/${cart.id}/delete" class="px-3 py-1 bg-red-600 text-white rounded text-xs hover:bg-red-700">Delete</a>
                            </td>
                        </tr>
                    `);
                });
            }
        });
    </script>
</body>
</html>
