<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Social Settings</title>
    <link th:href="@{/public/css/tailwind.css}" href="/static/public/css/tailwind.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen">
<div class="page-wrapper">
    <div class="wrapper">
        <main class="content p-6">
            <div class="content-page-container max-w-xl mx-auto">
                <header class="mb-6">
                    <h1 class="text-2xl font-bold text-gray-900">Social Settings</h1>
                    <nav class="flex flex-wrap gap-4 mt-2">
                        <a href="/admin/settings/general" class="text-sm text-blue-600 hover:underline">General Settings</a>
                        <a href="/admin/settings/payment" class="text-sm text-blue-600 hover:underline">Payment Settings</a>
                        <a href="/admin/settings/shipping" class="text-sm text-blue-600 hover:underline">Shipping Settings</a>
                        <a href="/admin/settings/seo" class="text-sm text-blue-600 hover:underline">SEO Settings</a>
                        <a href="/admin/settings/social" class="text-sm font-medium text-gray-900">Social Settings</a>
                    </nav>
                </header>
                <form action="/admin/settings/social" method="post" class="bg-white p-6 border border-gray-200 rounded shadow-sm space-y-4 settings-form">
                    <div class="form-group">
                        <label for="facebookUrl" class="block text-sm font-medium text-gray-700 mb-1">Facebook URL:</label>
                        <input type="url" id="facebookUrl" name="facebookUrl" class="form-control w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div class="form-group">
                        <label for="twitterUrl" class="block text-sm font-medium text-gray-700 mb-1">Twitter URL:</label>
                        <input type="url" id="twitterUrl" name="twitterUrl" class="form-control w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div class="form-group">
                        <label for="instagramUrl" class="block text-sm font-medium text-gray-700 mb-1">Instagram URL:</label>
                        <input type="url" id="instagramUrl" name="instagramUrl" class="form-control w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div class="form-group">
                        <label for="linkedinUrl" class="block text-sm font-medium text-gray-700 mb-1">LinkedIn URL:</label>
                        <input type="url" id="linkedinUrl" name="linkedinUrl" class="form-control w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div class="form-group">
                        <label for="youtubeUrl" class="block text-sm font-medium text-gray-700 mb-1">YouTube URL:</label>
                        <input type="url" id="youtubeUrl" name="youtubeUrl" class="form-control w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div class="form-group">
                        <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition-colors">Save Social Settings</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
