<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">General Settings</title>
    <link th:href="@{/public/css/tailwind.css}" href="/static/public/css/tailwind.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="wrapper">
        <main class="content p-6">
            <div class="content-page-container max-w-xl mx-auto">
                <header class="mb-6">
                    <h1 class="text-2xl font-bold text-gray-900">General Settings</h1>
                </header>
                <form action="/admin/settings/general" method="post" class="bg-white p-6 border border-gray-200 rounded shadow-sm space-y-4">
                    <div class="form-group">
                        <label for="siteName" class="block text-sm font-medium text-gray-700 mb-1">Site Name:</label>
                        <input type="text" id="siteName" name="siteName" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="siteDescription" class="block text-sm font-medium text-gray-700 mb-1">Site Description:</label>
                        <textarea id="siteDescription" name="siteDescription" rows="4" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="adminEmail" class="block text-sm font-medium text-gray-700 mb-1">Admin Email:</label>
                        <input type="email" id="adminEmail" name="adminEmail" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="siteLogo" class="block text-sm font-medium text-gray-700 mb-1">Site Logo URL:</label>
                        <input type="text" id="siteLogo" name="siteLogo" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="siteUrl" class="block text-sm font-medium text-gray-700 mb-1">Site URL:</label>
                        <input type="url" id="siteUrl" name="siteUrl" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="siteAddress" class="block text-sm font-medium text-gray-700 mb-1">Site Address:</label>
                        <input type="text" id="siteAddress" name="siteAddress" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="sitePhone" class="block text-sm font-medium text-gray-700 mb-1">Site Phone:</label>
                        <input type="tel" id="sitePhone" name="sitePhone" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="siteCurrency" class="block text-sm font-medium text-gray-700 mb-1">Site Currency:</label>
                        <input type="text" id="siteCurrency" name="siteCurrency" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="siteLanguage" class="block text-sm font-medium text-gray-700 mb-1">Site Language:</label>
                        <select id="siteLanguage" name="siteLanguage" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                            <option value="en">English</option>
                            <option value="ar">Arabic</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="siteTimezone" class="block text-sm font-medium text-gray-700 mb-1">Site Timezone:</label>
                        <select id="siteTimezone" name="siteTimezone" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                            <option value="UTC">UTC</option>
                            <option value="GMT">GMT</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="siteStatus" class="block text-sm font-medium text-gray-700 mb-1">Site Status:</label>
                        <select id="siteStatus" name="siteStatus" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition-colors">Save Settings</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
