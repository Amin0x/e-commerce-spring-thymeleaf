<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Payment Settings</title>
    <link th:href="@{/public/css/tailwind.css}" href="/static/public/css/tailwind.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="wrapper">
        <main class="content p-6">
            <div class="content-page-container payment-settings-container max-w-xl mx-auto">
                <header class="mb-6">
                    <h1 class="text-2xl font-bold text-gray-900">Payment Settings</h1>
                    <nav class="flex gap-4 mt-2">
                        <a href="/admin/settings/general" class="text-sm text-blue-600 hover:underline">General Settings</a>
                        <a href="/admin/settings/payment" class="text-sm font-medium text-gray-900">Payment Settings</a>
                    </nav>
                </header>
                <form action="/admin/settings/payment" method="post" class="bg-white p-6 border border-gray-200 rounded shadow-sm space-y-4 settings-form">
                    <div class="form-group">
                        <label for="paymentGateway" class="block text-sm font-medium text-gray-700 mb-1">Payment Gateway:</label>
                        <select id="paymentGateway" name="paymentGateway" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                            <option value="paypal">PayPal</option>
                            <option value="stripe">Stripe</option>
                            <option value="square">Square</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="apiKey" class="block text-sm font-medium text-gray-700 mb-1">API Key:</label>
                        <input type="text" id="apiKey" name="apiKey" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="apiSecret" class="block text-sm font-medium text-gray-700 mb-1">API Secret:</label>
                        <input type="text" id="apiSecret" name="apiSecret" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="currency" class="block text-sm font-medium text-gray-700 mb-1">Currency:</label>
                        <input type="text" id="currency" name="currency" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="testMode" class="block text-sm font-medium text-gray-700 mb-1">Test Mode:</label>
                        <select id="testMode" name="testMode" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                            <option value="true">Enabled</option>
                            <option value="false">Disabled</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition-colors">Save Payment Settings</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
