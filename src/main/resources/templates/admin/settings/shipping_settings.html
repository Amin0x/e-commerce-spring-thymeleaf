<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Shipping Settings</title>
    <link th:href="@{/public/css/tailwind.css}" href="/static/public/css/tailwind.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen">
<div class="wrapper">
    <main class="content p-6">
        <div class="content-page-container max-w-xl mx-auto">
            <header class="mb-6 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-900">Shipping Settings</h1>
                <nav class="flex gap-4">
                    <a href="/admin/settings/general" class="text-sm text-blue-600 hover:underline">General Settings</a>
                    <a href="/admin/settings/payment" class="text-sm text-blue-600 hover:underline">Payment Settings</a>
                    <a href="/admin/settings/shipping" class="text-sm font-medium text-gray-900">Shipping Settings</a>
                </nav>
            </header>
            <form action="/admin/settings/shipping" method="post" class="bg-white p-6 border border-gray-200 rounded shadow-sm space-y-4 settings-form">
                <div class="form-group">
                    <label for="shippingMethod" class="block text-sm font-medium text-gray-700 mb-1">Shipping Method:</label>
                    <select id="shippingMethod" name="shippingMethod" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                        <option value="standard">Standard</option>
                        <option value="express">Express</option>
                        <option value="overnight">Overnight</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="flatRate" class="block text-sm font-medium text-gray-700 mb-1">Flat Rate:</label>
                    <input type="number" id="flatRate" name="flatRate" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required step="0.01">
                </div>
                <div class="form-group">
                    <label for="freeShippingThreshold" class="block text-sm font-medium text-gray-700 mb-1">Free Shipping Threshold:</label>
                    <input type="number" id="freeShippingThreshold" name="freeShippingThreshold" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required step="0.01">
                </div>
                <div class="form-group">
                    <label for="handlingFee" class="block text-sm font-medium text-gray-700 mb-1">Handling Fee:</label>
                    <input type="number" id="handlingFee" name="handlingFee" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required step="0.01">
                </div>
                <div class="form-group">
                    <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition-colors">Save Shipping Settings</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
