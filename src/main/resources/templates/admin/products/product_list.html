<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Products</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link th:href="@{/public/css/tailwind.css}" href="../../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../../static/admin/main.css" rel="stylesheet">
    <style>
        .search-input-group {
            width: 800px;
            margin-inline: auto;
        }
        .search-input-group input {
            width: 650px;
        }
    </style>
</head>
<body>

<div class="wrapper p-6">
    <aside th:replace="~{admin/fragments/navigation :: navigation}"></aside>
    <main class="content">
        <header th:replace="~{admin/fragments/header :: header}"></header>
        <div class="content-page-container product-list">
            <h2 class="page-title mb-4 text-2xl font-bold text-gray-900">All Products</h2>
            <div class="breadcrumb-container mb-6">
                <ol class="breadcrumb-list flex flex-wrap gap-2 list-none p-0 m-0">
                    <li class="breadcrumb-item"><a class="breadcrumb-link text-blue-600 hover:underline text-sm" href="/admin">Item 1</a></li>
                    <li class="breadcrumb-item"><a class="breadcrumb-link text-blue-600 hover:underline text-sm" href="/admin/products">Item 2</a></li>
                    <li class="breadcrumb-item"><a class="breadcrumb-link text-blue-600 hover:underline text-sm" href="/admin/products/list">Item 3</a></li>
                </ol>
            </div>
            <div class="search-container mb-6">
                <form action="/admin/products/search" method="get" class="search-form">
                    <div class="search-input-group input-group">
                        <input type="text" name="q" class="form-control w-full px-3 py-2 border border-gray-300 rounded-l" placeholder="Search..." value="">
                        <button class="btn btn-outline-success px-4 py-2 bg-green-600 text-white rounded-r hover:bg-green-700 transition-colors" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>
            </div>
            <div class="overflow-x-auto">
            <table class="table table-bordered w-full text-left border-collapse border border-gray-300" id="tableContent">
                <thead class="bg-gray-100">
                <tr>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600 cursor-pointer" th:sort="id">ID</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600 cursor-pointer" th:sort="title">Title</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600 cursor-pointer" th:sort="priceSDG">Price (SDG)</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600 cursor-pointer" th:sort="priceUSD">Price (USD)</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600 cursor-pointer" th:sort="priceUSD">Init Price</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600 cursor-pointer" th:sort="sold">Sold</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600 cursor-pointer" th:sort="stock">Stock</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600 cursor-pointer" th:sort="sku">SKU</th>
                    <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                <tr th:each="product, iter : ${products}" th:class="${iter.odd} ? 'bg-gray-50' : ''" class="border-b border-gray-200 last:border-b-0 hover:bg-gray-50">
                    <td class="px-4 py-2 text-sm" th:text="${product.productId}">1</td>
                    <td class="px-4 py-2 text-sm" th:text="${product.name}">Product Title</td>
                    <td class="px-4 py-2 text-sm" th:text="${product.price}">100.00</td>
                    <td class="px-4 py-2 text-sm" th:text="${product.priceUSD}">20.00</td>
                    <td class="px-4 py-2 text-sm" th:text="${product.initPrice}">20.00</td>
                    <td class="px-4 py-2 text-sm" th:text="${product.totalSold}">50</td>
                    <td class="px-4 py-2 text-sm" th:text="${product.stock}">200</td>
                    <td class="px-4 py-2 text-sm" th:text="${product.sku}">SKU1234</td>
                    <td class="px-4 py-2 text-sm flex gap-2">
                        <a th:href="@{/admin/products/edit/{id}(id=${product.productId})}" class="px-3 py-1 bg-blue-600 text-white rounded text-xs hover:bg-blue-700 transition-colors">Edit</a>
                        <a th:href="@{/admin/products/delete/{id}(id=${product.productId})}" class="px-3 py-1 bg-red-600 text-white rounded text-xs hover:bg-red-700 transition-colors">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
            </div>
            <div class="mt-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="text-sm text-gray-700">
                    Page <span th:text="${currentPage}" class="font-medium">1</span> of <span th:text="${totalPages}" class="font-medium">10</span>
                </div>
                <div class="flex gap-2">
                    <a th:href="@{/admin/products/all(page=${currentPage-1}, size=${size}, sort=${sortField}, dir=${sortDirection})}"
                       class="px-3 py-1 bg-blue-600 text-white rounded text-sm hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none"
                       th:if="${currentPage > 1}">Previous</a>
                    <a th:href="@{/admin/products/all(page=${currentPage+1}, size=${size}, sort=${sortField}, dir=${sortDirection})}"
                       class="px-3 py-1 bg-blue-600 text-white rounded text-sm hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none"
                       th:if="${currentPage < totalPages}">Next</a>
                </div>
            </div>
        </div>

    </main>
</div>
<footer th:replace="~{admin/fragments/footer::footer}"></footer>
</body>
</html>
