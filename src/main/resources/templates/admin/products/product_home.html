<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Admin - Products</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../../static/admin/main.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="wrapper p-6">
    <div th:replace="~{admin/fragments/navigation :: navigation}"></div>
    <main class="content">
        <header th:replace="~{admin/fragments/header :: header}"></header>
        <div class="content-page-container product-home px-3">
            <h1 class="page-title my-4 text-2xl font-bold text-gray-900">Dashboard - Products</h1>
            <div class="links flex gap-4 mb-6">
                <a class="" href="#" th:href="@{/admin/products/all}" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">All products</a>
                <a class="" href="#" th:href="@{/admin/products/create}" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition-colors">Create product</a>
            </div>
            <div class="counter-container grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <article class="counter bg-white border border-gray-200 rounded p-4 shadow-sm">
                    <h4 class="text-sm font-semibold text-gray-600 mb-2">Total Products</h4>
                    <p th:text="${totalProducts}" class="text-lg font-bold text-gray-900">0</p>
                </article>
                <article class="counter bg-white border border-gray-200 rounded p-4 shadow-sm">
                    <h4 class="text-sm font-semibold text-gray-600 mb-2">Total Sold</h4>
                    <p th:text="${totalSold}" class="text-lg font-bold text-gray-900">0</p>
                </article>
                <article class="counter bg-white border border-gray-200 rounded p-4 shadow-sm">
                    <h4 class="text-sm font-semibold text-gray-600 mb-2">Total Unsold</h4>
                    <p th:text="${totalUnsold}" class="text-lg font-bold text-gray-900">0</p>
                </article>
                <article class="counter bg-white border border-gray-200 rounded p-4 shadow-sm">
                    <h4 class="text-sm font-semibold text-gray-600 mb-2">Total Revenue</h4>
                    <p th:text="${totalRevenue}" class="text-lg font-bold text-gray-900">0</p>
                </article>
            </div>
            <div class="charts-wrp box-round mt-6 bg-white border border-gray-200 rounded shadow-sm">
                <div class="market-chart p-4">
                    <header class="box-header with-small-txt mb-4">
                        <h4 class="title text-lg font-bold text-gray-800">Last Added Products</h4>
                    </header>
                    <div class="hline-sm border-t border-gray-200 mb-4"></div>
                    <div>
                        <table id="lastAddedProd" class="w-full text-left border-collapse border border-gray-300">
                            <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">#</th>
                                <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Title</th>
                                <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Sold</th>
                            </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                            <tr th:each="prod : ${lastAddedProducts}" class="hover:bg-gray-50">
                                <td class="px-4 py-2 text-sm"><span th:text="${prod.id}"></span></td>
                                <td class="px-4 py-2 text-sm" th:text="${prod.name}"></td>
                                <td class="px-4 py-2 text-sm"><span th:text="${prod.totalSold}">0</span></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="list-container mt-6">
                <div class="list box-round bg-white border border-gray-200 rounded shadow-sm overflow-hidden">
                    <header class="box-header border-b border-gray-200 bg-gray-50 p-4">
                        <div class="flex justify-between items-center">
                            <h4 class="title text-lg font-bold text-gray-800">Top 10 Sold Products</h4>
                            <div><a class="link text-blue-600 hover:underline text-sm" href="/admin/products/all?sort=12&asd=1" target="_blank">View all</a></div>
                        </div>
                    </header>
                    <div class="hline-sm border-t border-gray-200"></div>
                    <table class="w-full text-left border-collapse">
                        <tbody class="divide-y divide-gray-200">
                        <tr th:each="product : ${topSoldProducts}" class="last:border-b-0 hover:bg-gray-50">
                            <td class="px-4 py-2 text-sm"><span th:text="${product.productId}"></span></td>
                            <td class="px-4 py-2 text-sm">
                                <a th:href="@{/admin/products/{id}(id=${product.productId})}" th:text="${product.name}" class="text-blue-600 hover:underline">Product Name</a>
                            </td>
                            <td class="px-4 py-2 text-sm"><span th:text="${product.totalSold}">0</span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="list box-round bg-white border border-gray-200 rounded shadow-sm overflow-hidden mt-4">
                    <header class="box-header border-b border-gray-200 bg-gray-50 p-4">
                        <div class="flex justify-between items-center">
                            <h4 class="title text-lg font-bold text-gray-800">Top 10 Unsold Products</h4>
                            <div><a class="link text-blue-600 hover:underline text-sm" href="/admin/products/all?sort=12&asd=0" target="_blank">View all</a></div>
                        </div>
                    </header>
                    <div class="hline-sm border-t border-gray-200"></div>
                    <table class="w-full text-left border-collapse">
                        <tbody class="divide-y divide-gray-200">
                        <tr th:each="product : ${topUnsoldProducts}" class="last:border-b-0 hover:bg-gray-50">
                            <td class="px-4 py-2 text-sm"></td>
                            <td class="px-4 py-2 text-sm"><a href=""><span th:text="${product.name}" class="text-blue-600 hover:underline">Product Name</span></a></td>
                            <td class="px-4 py-2 text-sm"><span th:text="${product.totalSold}">0</span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/public/js/main.js}" src="../../../static/public/js/main.js"></script>
<script id="productsSoldChartData" type="application/json" th:data-months="${months}" th:data-products-sold="${productsSoldData}" th:data-market-price="${marketPriceData}"></script>
<script>
    const chartDataEl = document.getElementById('productsSoldChartData');
    const months = JSON.parse(chartDataEl.dataset.months || '[]');
    const productsSoldData = JSON.parse(chartDataEl.dataset.productsSold || '[]');
    const marketPriceData = JSON.parse(chartDataEl.dataset.marketPrice || '[]');

    const productsSoldCtx = document.getElementById('productsSoldChart');
    const marketPriceCtx = document.getElementById('marketPriceChart');

    if (productsSoldCtx) {
        const productsSoldChart = new Chart(productsSoldCtx.getContext('2d'), {
            type: 'bar',
            data: {
                labels: months,
                datasets: [{
                    label: 'Products Sold',
                    data: productsSoldData,
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });
    }

    if (marketPriceCtx) {
        const marketPriceChart = new Chart(marketPriceCtx.getContext('2d'), {
            type: 'line',
            data: {
                labels: months,
                datasets: [{
                    label: 'Market Price',
                    data: marketPriceData,
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });
    }
</script>
</body>
</html>
