<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Add City Form</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../static/css/admin/main.css" rel="stylesheet">

    <style>
        h1 {
            margin-top: 0;
            text-align: center;
            color: #333;
        }
        label, input, select {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="am-city-card max-w-sm mx-auto p-6 bg-white border border-gray-300 rounded-lg shadow-sm">
        <h1 class="text-xl font-bold text-center text-gray-800 mb-6">Add a New City</h1>
        <form id="cityForm" method="POST" class="space-y-4">
            <input type="hidden" name="id" id="cityid" th:value="${city?.id}">
            <div class="input-container">
                <label for="name" class="block text-sm font-medium text-gray-700">City Name:</label>
                <input type="text" id="name" class="text-input w-full px-3 py-2 border border-gray-300 rounded" name="nmae" th:value="${city?.name}">
                <div class="error-message text-red-600 text-sm mt-1" id="nameError"></div>
            </div>
            <div class="input-container">
                <label for="nameAr" class="block text-sm font-medium text-gray-700">City Name (Arabic):</label>
                <input type="text" id="nameAr" class="text-input w-full px-3 py-2 border border-gray-300 rounded" name="nameAr" th:value="${city?.nameAr}">
                <div class="error-message text-red-600 text-sm mt-1" id="nameArError"></div>
            </div>
            <div class="input-container">
                <label for="estimatedDelivery" class="block text-sm font-medium text-gray-700">Estimated Delivery:</label>
                <input type="text" id="estimatedDelivery" class="text-input w-full px-3 py-2 border border-gray-300 rounded" name="estimatedDelivery" th:value="${city?.estimatedDelivery}">
                <div class="error-message text-red-600 text-sm mt-1" id="estimatedDeliveryError"></div>
            </div>
            <div class="input-container">
                <label for="deliveryPrice" class="block text-sm font-medium text-gray-700">Delivery Price:</label>
                <input type="text" id="deliveryPrice" class="text-input w-full px-3 py-2 border border-gray-300 rounded" name="deliveryPrice" th:value="${city?.deliveryPrice}">
                <div class="error-message text-red-600 text-sm mt-1" id="deliveryPriceError"></div>
            </div>
            <div class="input-container">
                <label for="deliveryPriority" class="block text-sm font-medium text-gray-700">Delivery Priority:</label>
                <select id="deliveryPriority" class="text-input w-full px-3 py-2 border border-gray-300 rounded" name="deliveryPriority">
                    <option value="Normal" th:attr="selected=(${city?.deliveryPriority} == 'Normal'? selected:null)">Normal</option>
                    <option value="High" th:attr="selected=(${city?.deliveryPriority} == 'High'? selected:null)">High</option>
                    <option value="Low" th:attr="selected=(${city?.deliveryPriority} == 'Low'? selected:null)">Low</option>
                </select>
                <div class="error-message text-red-600 text-sm mt-1" id="deliveryPriorityError"></div>
            </div>
            <div class="input-container">
                <span class="am-label block text-sm font-medium text-gray-700">Select Country:</span>
                <select class="text-input w-full px-3 py-2 border border-gray-300 rounded" id="country" name="country">
                    <option value="" disabled selected>Select a Country</option>
                    <option th:each="country : ${countries}" th:value="${country?.id}" th:text="${country?.name}"
                    th:attr="selected=(${country.id} == ${city?.country?.id}? selected:null)"></option>
                </select>
                <div class="error-message text-red-600 text-sm mt-1" id="countryError"></div>
            </div>
            <div class="input-container">
                <span class="am-label block text-sm font-medium text-gray-700">Select State:</span>
                <select class="text-input w-full px-3 py-2 border border-gray-300 rounded" id="state" name="state">
                    <option value="" disabled selected>Select a State</option>
                    <option th:each="state : ${states}" th:value="${state.id}" th:text="${state.name}"
                    th:attr="selected=(${state?.id} == ${city?.state?.id}? selected:null)"></option>
                </select>
                <div class="error-message text-red-600 text-sm mt-1" id="stateError"></div>
            </div>
            <div class="button-submit mt-6">
                <button type="submit" class="button-30 w-full px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700" id="SubmitForm">Add City</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            cityCreatePage();
        });

    </script>
</body>
</html>
