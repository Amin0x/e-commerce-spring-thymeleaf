<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Add Country Form</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../static/css/admin/main.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #333;
        }

        label,
        input,
        select {
            display: inline-block;
        }

        #countryError,
        #nameArError {
            color: red;
        }

        .am-form-group {
            margin-bottom: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #4CAF50;
        }

        input:checked+.slider:before {
            transform: translateX(14px);
        }
    </style>
</head>

<body>
    <div class="am-city-card max-w-sm mx-auto p-6 bg-white border border-gray-300 rounded-lg shadow-sm">
        <h1 class="title text-xl font-bold text-center text-gray-800 mb-6" th:text="${formTitle}">Add a New Contery</h1>
        <form id="cityForm" method="POST" class="space-y-4">
            <input type="hidden" name="id" id="countryId" th:value="${country.id}">
            <div class="am-form-group">
                <label for="name" class="block text-sm font-medium text-gray-700">Name:</label>
                <input type="text" id="name" name="name" class="w-full px-3 py-2 border border-gray-300 rounded focus:border-green-500 focus:outline-none" th:value="${country.name}">
                <div id="nameError" class="text-red-600 text-sm mt-1"></div>
            </div>
            <div class="am-form-group">
                <label for="nameAr" class="block text-sm font-medium text-gray-700">Name (arabic):</label>
                <input type="text" id="nameAr" name="nameAr" class="w-full px-3 py-2 border border-gray-300 rounded focus:border-green-500 focus:outline-none" th:value="${country.nameAr}">
                <div id="nameArError" class="text-red-600 text-sm mt-1"></div>
            </div>
            <div class="am-form-group flex items-center gap-3">
                <label class="switch inline">
                    <input type="checkbox" id="enabled" name="enabled" th:checked="${country.enabled}">
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="button-submit mt-6">
                <button type="submit" class="button-30 w-full px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition-colors">Save</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const cityForm = document.getElementById('cityForm');
            const nameInput = document.getElementById('name');
            const nameArInput = document.getElementById('nameAr');
            const nameError = document.getElementById('nameError');
            const nameArError = document.getElementById('nameArError');
            const submitButton = cityForm.querySelector('button[type=submit]');
            const countryId = document.getElementById('countryId').value;
            let url = '/admin/address/country';

            cityForm.addEventListener('submit', function (e) {
                e.preventDefault();

                // Clear previous error messages
                nameError.textContent = '';
                nameArError.textContent = '';

                // Validate name
                const name = nameInput.value;
                if (!name || name.length < 3) {
                    nameError.textContent = 'City name must be at least 3 characters long.';
                    return;
                }

                // Validate nameAr
                const nameAr = nameArInput.value;
                if (!nameAr || nameAr.length < 3) {
                    nameArError.textContent = 'City name in Arabic is required and must be at least 3 characters long.';
                    return;
                }

                const formData = {
                    name: name,
                    nameAr: nameAr,
                    id: countryId,
                };

                submitButton.disabled = true;
                submitButton.textContent = 'Saveing...';

                if (countryId !== '' || countryId !== null) {
                    url = '/admin/address/country?id=' + countryId;
                }

                fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Error adding city!');
                        }
                        return response.json();
                    })
                    .then(data => {
                        nameInput.value = data.country.name;
                        nameArInput.value = data.country.nameAr;
                        document.getElementById('countryId').value = data.country.id;
                        // Show success message
                        const popover = document.createElement('div');
                        popover.className = 'popover';
                        popover.textContent = 'City added successfully!';
                        document.body.appendChild(popover);
                        setTimeout(() => {
                            popover.style.opacity = '0';
                            setTimeout(() => { popover.remove(); }, 500);
                        }, 3000);
                        submitButton.disabled = false;
                        submitButton.textContent = 'Save';
                    })
                    .catch(error => {
                        submitButton.disabled = false;
                        submitButton.textContent = 'Save';
                    });
            });
        });
    </script>
</body>

</html>
