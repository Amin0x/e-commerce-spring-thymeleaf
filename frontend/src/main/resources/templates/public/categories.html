<!DOCTYPE html>
<html lang="en" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Company Name" th:content="${pageAuthor}">
    <meta name="copyright" content="Company Name" th:content="${pageCopyright}">
    <meta name="description" content="Company Name" th:content="${pageDescription}">
    <meta name="keywords" content="Company Name" th:content="${pageKeywords}">
    <meta name="robots" content="index, follow" th:content="${PageRobots}">
    <title th:text="${pageTitle}">categories List</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/public/css/style.css}" href="../../static/public/css/style.css" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <header id="header" class="header">
        <nav th:replace="~{public/fragments/navbar :: navbar}" class="navbar-wrp"></nav>
    </header>
    <main class="content all-products px-4 py-6">
        <div class="title mb-6">
            <h1 class="text-2xl font-bold text-gray-800">جميع الاصناف</h1>
        </div>
        <section class="flex-row grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div th:each="category : ${categories}" class="product-card card">
                <div class="product card-body">
                    <div class="image">
                        <img th:src="${category.imageUrl}" src="../../static/public/imgs/img12.jpg" class="product-img card-img-top w-full h-48 object-cover" alt="Product Image" th:alt="${category.name}">
                    </div>
                    <div class="product-details">
                        <h5 th:text="${category.name}" class="product-title font-semibold text-gray-800">عنوان المنتج عنوان المنتج عنوان المنتج</h5>
                    </div>
                </div>
            </div>
        </section>
        <section class="mt-6">
            <nav aria-label="Page navigation" class="flex justify-center gap-1">
                <ul class="pagination flex items-center gap-1">
                    <li class="page-item disabled"><a class="page-link px-3 py-1 border border-gray-300 rounded text-gray-400 cursor-not-allowed" href="#" aria-label="Previous"><span aria-hidden="true">&laquo;</span></a></li>
                    <li class="page-item active"><a class="page-link px-3 py-1 bg-blue-600 text-white border border-blue-600 rounded" href="#">1</a></li>
                    <li class="page-item"><a class="page-link px-3 py-1 border border-gray-300 rounded text-gray-700 hover:bg-gray-100" href="#">2</a></li>
                    <li class="page-item"><a class="page-link px-3 py-1 border border-gray-300 rounded text-gray-700 hover:bg-gray-100" href="#">3</a></li>
                    <li class="page-item"><a class="page-link px-3 py-1 border border-gray-300 rounded text-gray-700 hover:bg-gray-100" href="#" aria-label="Next"><span aria-hidden="true">&raquo;</span></a></li>
                </ul>
            </nav>
        </section>
    </main>
    <div th:replace="public/fragments/footer :: footer"></div>
</div>
</body>
</html>
