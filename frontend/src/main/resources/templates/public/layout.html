<!DOCTYPE html>
<html lang="en" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Meta Tags -->
    <meta name="description" content="Home page description for your website." th:content="${description}">
    <meta name="author" content="Your Name or Company Name" th:content="${author}">
    <meta name="keywords" content="home, page, example, website" th:content="${keywords}">
    <title th:text="${title}">My Application</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/public/css/style.css}" href="../../static/public/css/style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar flex flex-wrap items-center justify-between px-4 py-3 bg-white border-b border-gray-300">
            <ul class="menu-container flex gap-2">
                <li><a class="nav-link" href="/" th:href="@{/}">Home</a></li>
                <li><a class="nav-link" href="/about" th:href="@{/about}">About</a></li>
                <li><a class="nav-link" href="/contact" th:href="@{/contact}">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div th:replace="~{::body}"></div> <!-- Placeholder for content -->
    </main>

    <footer th:replace="~{public/fragments/footer :: footer}"></footer>
</body>
</html>
