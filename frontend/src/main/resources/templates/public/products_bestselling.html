<!DOCTYPE html>
<html lang="en" dir="rtl" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Company Name">
  <meta name="keywords" content="Company Name">
  <meta name="robots" content="index, follow">
  <title th:text="${title}">Product List</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
  <link th:href="@{/public/css/style.css}" href="../../static/public/css/style.css" rel="stylesheet">
</head>

<body class="bg-gray-50">
  <main class="wrapper">
    <nav th:replace="~{public/fragments/navbar :: navbar}" class="navbar-wrp"></nav>
    <div class="bestselling-container content p-4 rtl">
      <div class="title mb-4">
        <h4 class="text-sm font-medium text-gray-900 rtl:text-right">الاكثر مبيعا</h4>
      </div>
      <section class="products-container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
        <div th:each="product : ${products}" class="group">
          <div class="product-card bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm flex flex-col h-full">
            <div class="product-card__image relative h-48 overflow-hidden">
              <a th:href="@{/products/{id}(id=${product.slug})}" href="#" class="block">
                <img th:src="${product.image}" class="product-image w-full h-full object-fit-cover object-center" alt="Product Image" src="">
              </a>
              <a class="circle-container absolute top-2 left-2 p-1 bg-white rounded-full shadow-sm rtl:left-auto rtl:right-2" th:data-heart="${product.productId}">
                <i class="far fa-heart text-gray-600 group-hover:text-red-600 transition-colors text-xl"></i>
              </a>
              <span class="badge-container absolute top-2 right-2 rtl:right-auto rtl:left-2">
                <span th:if="product.new" class="new bg-red-500 text-white text-xs px-2 py-1 rounded font-semibold rtl:text-right">جديد</span>
              </span>
            </div>
            <div class="product-card__body flex-grow p-4 flex flex-col justify-between">
              <div th:text="${product.name}" class="product-title text-sm font-medium text-gray-900 truncate mb-2 block rtl:text-right">Product Title</div>
              <div class="product-price text-sm font-medium text-red-600 rtl:text-right" th:text="|${product.price} جنيه|">$49.99 ج.س</div>
              <div th:if="(${product.price} &lt; ${product.basePrice})" class="product-discount text-sm text-gray-500 line-through rtl:text-right">
                <span th:text="|${product.basePrice} جنيه|">$49.99 ج.س</span>
              </div>
              <button type="button" class="button-31 mt-auto pt-4 w-full px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors text-sm font-medium" th:data-add-cart="${product.productId}">اضافة للعربة</button>
            </div>
          </div>
        </div>
      </section>
      <div class="paginate mt-8 flex justify-center gap-2 rtl">
        <a href="#" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">1</a>
        <a href="#" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50"></a>
        <a href="#" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50"></a>
        <a href="#" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50"></a>
        <a href="#" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50"></a>
        <a href="#" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50"></a>
        <a href="#" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50"></a>
        <a href="#" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">100</a>
      </div>
    </div>
    <footer th:replace="public/fragments/footer :: footer" class="mt-8"></footer>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const hearts = document.querySelectorAll('[data-heart]');
      hearts.forEach(heart => {
        heart.addEventListener('click', function () {
          heart.classList.toggle('active');
        });
      });

      const addcarts = document.querySelectorAll('[data-add-cart]');
      addcarts.forEach(addcart => {
        addcart.addEventListener('click', function (e) {
          e.preventDefault();
          const productId = addcart.getAttribute('data-add-cart');
          const fd = new FormData();
          fd.append('productId', productId);
          fd.append('quantity', 1);

          fetch('/carts/addToCart', {
            method: 'POST',
            body: fd,
          }).then(response => response.json()).then(data => {
            if (data !== undefined && data.totalItems === undefined) {
              console.log('added to cart successfully : ' + productId );
              document.querySelector('#cartItemsCount').textContent = data.totalItems;
            } else {
              console.log('failed to add to cart : ' + productId );
            }
          }).catch(error => {
            console.error('Error:', error);
          });
        });
      });
    });
  </script>
</body>

</html>
