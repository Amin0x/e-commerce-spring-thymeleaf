<!DOCTYPE html>
<html lang="en" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Company Name">
  <meta name="keywords" content="Company Name">
  <meta name="robots" content="index, follow">
  <title th:text="${title}">Product List</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
  <link th:href="@{/public/css/style.css}" href="../../static/public/css/style.css" rel="stylesheet">
</head>
<body>
    <main class="wrapper">
        <nav th:replace="~{public/fragments/navbar :: navbar}" class="navbar-wrp"></nav>
      <div class="all-products px-4 py-6">
        <div class="title mb-6">
          <h1 class="text-2xl font-bold text-gray-800">جميع المنتجات</h1>
        </div>
        <div class="sort-filter mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div class="sort w-full sm:w-auto">
              <span class="label block text-sm font-medium text-gray-700 w-full sm:inline-block mr-2 sm:mr-0 sm:mb-0">ترتيب حسب:</span>
              <select id="sort" name="sort" class="form-control w-full sm:w-auto max-w-xs" aria-label="sort">
                  <option value="default">الترتيب الافتراضي</option>
                  <option value="price">السعرالاقل</option>
                  <option value="price">السعر الاعلي</option>
                  <option value="popular">المرغوب</option>
              </select>
          </div>
        </div>
        <section class="flex-row grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
          <div th:each="product : ${products}" class="product-card card">
              <div class="product card-body">
                <div class="image relative">
                  <a href="#" class="clink block group">
                    <img th:src="|@{/uploads/images/{id}(id=${product.image})}|" src="../../static/public/imgs/img12.jpg" class="product-img card-img-top w-full h-48 object-cover group-hover:scale-105 transition-transform duration-300" alt="Product Image" th:alt="${product.name}">
                  </a>
                        <span th:if="true" class="product-new absolute top-2 left-2 bg-red-500 text-white text-xs px-2 py-1 rounded">جديد</span>
                        <span th:if="true" class="product-popular absolute top-2 right-2 bg-blue-600 text-white text-xs px-2 py-1 rounded">مرغوب</span>
                        <a href="#">
                          <span class="favorite absolute bottom-2 right-2 text-gray-600 hover:text-red-600"><i class="far fa-heart text-lg"></i></span>
                        </a>
                    </div>
                  <div class="product-details">
                      <h5 th:text="${product.name}" class="product-title font-semibold text-gray-800 mb-2">عنوان المنتج عنوان المنتج عنوان المنتج</h5>
                      <p th:text="${product.price}" class="product-price text-gray-600"><strong>$49.99</strong></p>
                      <p th:if="(${product.price} < ${product.basePrice})" th:text="${product.basePrice}" class="product-discount text-sm text-gray-400 line-through"><strong>$49.99</strong></p>
                  </div>
                  <button th:data-add-to-cart="${product.id}" data-quantity="1" type="button" role="button" class="button-37 add-cart btn btn-primary w-full mt-4">اضافة الي السلة</button>
              </div>
          </div>
        </section>
        <section class="mt-6">
          <nav aria-label="Page navigation" class="flex justify-center gap-1">
            <ul class="pagination flex items-center gap-1">
              <li class="page-item disabled"><a class="page-link px-3 py-1 border border-gray-300 rounded text-gray-400 cursor-not-allowed" href="#" aria-label="Previous"><span aria-hidden="true">&laquo;</span></a></li>
              <li class="page-item active"><a class="page-link px-3 py-1 bg-blue-600 text-white border border-blue-600 rounded" href="#">1</a></li>
              <li class="page-item"><a class="page-link px-3 py-1 border border-gray-300 rounded text-gray-700 hover:bg-gray-100" href="#">2</a></li>
              <li class="page-item"><a class="page-link px-3 py-1 border border-gray-300 rounded text-gray-700 hover:bg-gray-100" href="#">3</a></li>
              <li class="page-item"><a class="page-link px-3 py-1 border border-gray-300 rounded text-gray-700 hover:bg-gray-100" href="#" aria-label="Next"><span aria-hidden="true">&raquo;</span></a></li>
            </ul>
          </nav>
        </section>
      </div>
      <div th:replace="public/fragments/footer :: footer"></div>
    </main>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
