<!DOCTYPE html>
<html lang="en" dir="rtl" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Login Page</title>
    <link rel="icon" th:href="@{/public/imgs/favicon.png}" href="../../static/public/imgs/favicon.png" type="image/png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/public/css/style.css}" href="../../static/public/css/style.css">
</head>
<body>
    <div class="wrapper min-h-screen flex items-center justify-center bg-gray-50 px-4">
        <div class="login">
            <div class="login-container card w-full max-w-md">
                <p class="login__form-icon text-blue-600 mb-4"><i class="fas fa-lock text-2xl"></i></p>
                <h2 class="login-title text-2xl font-bold text-gray-800 text-center mb-6">مرحبا بعودتك</h2>
                <form id="loginForm" th:action="@{/auth/login}" method="post">
                    <div class="input-container form-group mb-4">
                        <label for="username" class="form-label block text-sm font-medium text-gray-700 mb-1">اسم المتستخدم:</label>
                        <input type="text" name="username" class="form-control" id="username" placeholder="">
                    </div>
                    <div class="input-container form-group mb-6">
                        <label for="password" class="form-label block text-sm font-medium text-gray-700 mb-1">كلمة المرور:</label>
                        <input type="password" name="password" class="form-control" id="password" placeholder="">
                    </div>
                    <button type="submit" class="button-31 btn btn-primary w-full" id="submitButton">دخول</button>
                </form>
                <div class="login__form-footer mt-6 text-center">
                    <p class="forgot-password text-sm text-gray-600 mb-2"><a href="#" class="forgot-password-link text-blue-600 hover:underline">نسيت كلمة المرور؟</a></p>
                    <p class="signup text-sm text-gray-600">ليس لديك حساب؟ <a href="/auth/register" class="signup-link text-blue-600 hover:underline">تسجيل جديد</a></p>
                </div>
            </div>
            <div class="divider my-8 relative">
                <div class="absolute inset-0 border-t border-gray-300"></div>
                <span class="bg-gray-50 px-4 text-sm text-gray-500 relative">أو استمر مع</span>
            </div>
            <div class="other-login">
                <div class="alt-login flex gap-3 justify-center">
                    <button type="submit" class="button-31 btn btn-primary google-button flex-1">دخول باستخدام قوقل <i class="fab fa-google"></i></button>
                    <button type="submit" class="button-31 btn btn-danger facebook-button flex-1">دخول باستخدام فيسبوك <i class="fab fa-facebook"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{https://code.jquery.com/jquery-3.6.0.min.js}"></script>
    <script src="../../static/public/js/main.js" th:src="@{/public/js/main.js}"></script>

</body>

</html>
