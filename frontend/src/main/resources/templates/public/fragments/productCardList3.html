<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
</head>
<body>
<div class="products grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" th:fragment="productCardList3(products)">
    <div th:each="product : ${products}" class="product-card-a card p-3">
        <div class="card-img relative p-0 group">
            <a class="absolute top-2 right-2" th:data-heart="${product.id}" aria-label="Add to favorites">
                <i class="far fa-heart text-gray-500 group-hover:text-red-500 transition-colors"></i>
            </a>
            <a th:href="@{/products/{id}(id=${product.slug})}" href="#" class="block">
                <img alt="" class="product-img w-full h-auto block" src="" th:alt="${product.name}"
                     th:src="${'/uploads/images/' + product.image}">
            </a>
        </div>
        <div class="card-body mt-2">
            <p class="product-title text-lg font-semibold mb-1" th:text="${#strings.abbreviate(product.name, 40)}">Title</p>
            <p class="product-price text-blue-600 font-bold" th:text="|${product.price} جنيه|">200</p>
            <p class="product-price-discount text-gray-500 text-sm line-through" th:text="${product.basePrice} + ' جنيه'">100</p>
        </div>
    </div>
</div>
</body>
</html>
