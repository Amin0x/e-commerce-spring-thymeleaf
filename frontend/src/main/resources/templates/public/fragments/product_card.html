<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link href="./../../static/public/css/style.css" rel="stylesheet">
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
</head>
<body>

<div th:fragment="productCardList(products)" class="all-products grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="product-card" th:each="product : ${products}">
        <div class="card relative p-3">
            <div class="image relative h-48 overflow-hidden rounded-lg">
                <div class="icon absolute top-2 left-2">
                    <i class="far fa-heart text-gray-500 cursor-pointer hover:text-red-500"></i>
                </div>
                <img th:src="@{${product.image}}" src="https://via.placeholder.com/150" class="product-img w-full h-full object-cover" alt="Product Image" th:alt="${product.name}">
                <span th:if="true" class="product-new absolute top-2 right-2 bg-blue-600 text-white text-xs px-2 py-1 rounded">New</span>
                <span th:if="true" class="product-popular absolute bottom-2 right-2 bg-red-500 text-white text-xs px-2 py-1 rounded">Sale</span>
            </div>
            <div class="product-details mt-3">
                <h5 th:text="${product.name}" class="product-title text-lg font-bold">Product Title</h5>
                <p th:text="${product.price}" class="product-price text-blue-600 font-semibold"><strong>$49.99</strong></p>
                <p th:if="(${product.price} < ${product.initPrice})" th:text="${product.initPrice}" class="product-discount text-gray-500 text-sm line-through"><strong>$49.99</strong></p>
                <button th:data-add-to-cart="${product.id}" data-quantity="1" type="button" role="button" class="button-37 add-cart btn btn-primary mt-2 w-full">Add to Cart</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
