<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
</head>
<body>

<div class="container card2_container mx-auto px-4 mt-6 max-w-[900px]" th:fragment="productCardList2(products)">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <div th:each="product : ${products}">
            <div class="card bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="image-container relative h-48 overflow-hidden">
                    <div class="first absolute inset-0 flex justify-between items-center p-3 bg-black/10">
                        <span class="discount bg-red-600 text-white text-[10px] px-2 py-0.5 rounded" th:text="'-' + ${product.discount} + '%'">-25%</span>
                        <span class="wishlist w-6 h-6 bg-gray-200 flex items-center justify-center rounded-full shadow-sm">
                            <i class="fa fa-heart-o text-gray-600 text-[10px]"></i>
                        </span>
                    </div>
                    <img th:src="@{${product.imageUrl}}" class="w-full h-full object-cover rounded-none" alt="Product Image">
                </div>
                <div class="product-detail-container p-3">
                    <div class="flex justify-between items-center">
                        <h5 class="dress-name text-sm font-bold leading-tight line-clamp-2" th:text="${product.name}">Product Name</h5>
                        <div class="flex flex-col mb-2 text-right">
                            <span class="new-price text-sm font-bold text-red-600" th:text="'$' + ${product.newPrice}">$3.99</span>
                            <small class="old-price text-xs text-gray-500" th:text="'$' + ${product.oldPrice}">$5.99</small>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-2">
                        <div class="color-select flex gap-1">
                            <input type="button" name="grey" class="btn w-4 h-4 rounded-full border-2 border-gray-400">
                            <input type="button" name="red" class="btn w-4 h-4 rounded-full border-2 border-red-500 ml-1">
                            <input type="button" name="blue" class="btn w-4 h-4 rounded-full border-2 border-blue-500 ml-1">
                        </div>
                        <div class="flex gap-1">
                            <span class="item-size w-4 h-4 border border-gray-300 rounded-full text-xs flex items-center justify-center text-gray-600">S</span>
                            <span class="item-size w-4 h-4 border border-gray-300 rounded-full text-xs flex items-center justify-center text-gray-600">M</span>
                            <span class="item-size w-4 h-4 border border-gray-300 rounded-full text-xs flex items-center justify-center text-gray-600">L</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-2">
                        <div class="flex items-center gap-1">
                            <i class="fa fa-star-o text-xs text-gray-400"></i>
                            <span class="rating-number text-xs text-gray-600" th:text="${product.rating}">4.8</span>
                        </div>
                        <span class="buy text-xs text-purple-600 font-medium">BUY +</span>
                    </div>
                </div>
            </div>
            <div class="mt-4">
                <div class="card bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <div class="flex">
                        <div class="voutcher-left text-center w-3/5 p-3">
                            <span class="voutcher-name text-gray-600 text-[9px] font-medium block" th:text="${product.voucherName}">Monday Happy</span>
                            <h5 class="voutcher-code text-red-600 text-xs font-bold" th:text="'#' + ${product.voucherCode}">#MONHPY</h5>
                        </div>
                        <div class="voutcher-right bg-purple-600 text-white text-center w-2/5 flex flex-col justify-center items-center gap-1 p-3">
                            <h5 class="discount-percent text-sm font-bold" th:text="${product.voucherDiscount + '%'}">20%</h5>
                            <span class="off text-xs">Off</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
