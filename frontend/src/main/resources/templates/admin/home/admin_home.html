<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Admin Panel - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../static/admin/main.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="page-wrapper p-6">
        <div class="wrapper">
            <aside th:replace="~{admin/fragments/navigation :: navigation}"></aside>
            <main class="content">
                <header th:replace="~{admin/fragments/header :: header}"></header>
                <div class="admin-home-page content-page-container">
                    <section class="states grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                        <article class="state-card bg-white border border-gray-200 rounded p-4 shadow-sm">
                            <div class="state-card__body">
                                <h3 class="text-lg font-semibold text-gray-800">Users</h3>
                                <p class="text-xl font-bold text-gray-900"><span th:text="${statsUsers}">250</span></p>
                                <p class="text-sm text-gray-500"><small>this month</small></p>
                            </div>
                        </article>
                        <article class="state-card bg-white border border-gray-200 rounded p-4 shadow-sm">
                            <div class="state-card__body">
                                <h3 class="text-lg font-semibold text-gray-800">Orders</h3>
                                <p class="text-xl font-bold text-gray-900"><span th:text="${statsOrders}">120</span></p>
                                <p class="text-sm text-gray-500"><small>this month</small></p>
                            </div>
                        </article>
                        <article class="state-card bg-white border border-gray-200 rounded p-4 shadow-sm">
                            <div class="state-card__body">
                                <h3 class="text-lg font-semibold text-gray-800">Revenue</h3>
                                <p class="text-xl font-bold text-gray-900"><span th:text="${statsRevenue}">$5,000</span></p>
                                <p class="text-sm text-gray-500"><small>this month</small></p>
                            </div>
                        </article>
                    </section>
                    <section th:if="false" class="recent-activity">
                        <div class="recent-activity__content box-round">
                            <h2 class="box-title">Recent Activity</h2>
                            <ul>
                                <li th:each="activity : ${activities}" th:text="${activity.description}">Sample activity
                                </li>
                            </ul>
                        </div>
                    </section>
                    <section class="charts-container grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <section class="revenue box-round bg-white border border-gray-200 rounded p-4 shadow-sm">
                            <h2 class="text-lg font-bold text-gray-800 mb-2">Revenue</h2>
                            <div><small class="text-gray-500">Revenue in last 30 days</small></div>
                            <div class="hline-sm mb-2 border-t border-gray-200"></div>
                            <div style="width: 100%; height: 300px;">
                                <canvas id="myChart" style="height: 300px; max-width: 100%" th:data-field-vals="${data}" th:data-field-names="${labels}"></canvas>
                            </div>
                        </section>
                        <section class="revenue box-round bg-white border border-gray-200 rounded p-4 shadow-sm">
                            <h2 class="text-lg font-bold text-gray-800 mb-2">Orders</h2>
                            <div><small class="text-gray-500">Orders count in last 30 days</small></div>
                            <div style="width: 100%; height: 300px;">
                                <canvas id="myChart1" style="height: 300px; max-width: 100%" th:data-field-vals="|${data}|" th:data-field-names="|${labels}|"></canvas>
                            </div>
                        </section>
                        <section class="revenue box-round bg-white border border-gray-200 rounded p-4 shadow-sm">
                            <h2 class="text-lg font-bold text-gray-800 mb-2">Revenue</h2>
                            <div><small class="text-gray-500">Revenue in last 30 days</small></div>
                            <div style="width: 100%; height: 300px;">
                                <canvas id="myChart2" style="height: 300px; max-width: 50%" th:data-field-vals="|${data}|" th:data-field-names="|${labels}|"></canvas>
                            </div>
                        </section>
                    </section>
                </div>
            </main>
        </div>
        <footer th:replace="~{admin/fragments/footer::footer}"></footer>
    </div>

    <script th:src="@{/public/js/main.js}" src="../../static/public/js/main.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/

        const canvasElement = document.getElementById("myChart1");
        const fieldVals = canvasElement.getAttribute("data-field-vals");
        const fieldNames = canvasElement.getAttribute("data-field-names");
        const dataValsArray = JSON.parse(fieldVals);
        const dataNamesArray = JSON.parse(fieldNames);

        // Log or use the arrays
        console.log(dataValsArray); // Array of field values
        console.log(dataNamesArray); // Array of field names



        var ctx = document.getElementById('myChart').getContext('2d');
        var myChart = new Chart(ctx, {
            type: 'bar',  // Chart type (bar, line, etc.)
            data: {
                labels: dataNamesArray,  // X-axis labels
                datasets: [{
                    label: "chart",
                    data: dataValsArray,
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                /*aspectRatio: 1,*/
            }
        });
        var ctx1 = document.getElementById('myChart1').getContext('2d');
        var myChart1 = new Chart(ctx1, {
            type: 'bar',  // Chart type (bar, line, etc.)
            data: {
                labels: dataNamesArray,  // X-axis labels
                datasets: [{
                    label: 'My Data',
                    data: dataValsArray,  // The data from the server side
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                aspectRatio: 1,
            }
        });
        var ctx2 = document.getElementById('myChart2').getContext('2d');
        var myChart2 = new Chart(ctx2, {
            type: 'bar',  // Chart type (bar, line, etc.)
            data: {
                labels: dataNamesArray,  // X-axis labels
                datasets: [{
                    label: 'My Data',
                    data: dataValsArray,  // The data from the server side
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                aspectRatio: 1,
            }
        });
        /*]]>*/
    </script>
</body>

</html>
