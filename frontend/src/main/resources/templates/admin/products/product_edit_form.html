<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Edit Product</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../../static/admin/main.css" rel="stylesheet">
</head>

<body>
<div class="page-wrapper p-6">
    <div class="wrapper">
        <aside th:replace="~{admin/fragments/navigation :: navigation}"></aside>
        <main class="content">
            <header th:replace="~{admin/fragments/header :: header}"></header>
            <div class="content-page-container edit-product-container max-w-3xl mx-auto">
                <h1 class="page-title my-6 text-2xl font-bold text-gray-900">Edit Product</h1>
                <form id="editProductForm" class="space-y-6 bg-white border border-gray-200 rounded p-6 shadow-sm">
                    <div class="form-group space-y-2">
                        <label for="name" class="block text-sm font-medium text-gray-700">Name:</label>
                        <input type="text" class="form-control w-full px-3 py-2 border border-gray-300 rounded" id="name" name="name" th:value="${product.name}">
                        <small id="nameError" class="text-red-600 text-sm" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                    </div>
                    <div class="form-group space-y-2">
                        <label for="description" class="block text-sm font-medium text-gray-700">Description:</label>
                        <textarea class="form-control w-full px-3 py-2 border border-gray-300 rounded" id="description" name="description" rows="3" th:text="${product.description}"></textarea>
                        <small id="descriptionError" class="text-red-600 text-sm" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small>
                    </div>
                    <div class="form-group space-y-2">
                        <label for="price" class="block text-sm font-medium text-gray-700">Price:</label>
                        <input type="number" class="form-control w-full px-3 py-2 border border-gray-300 rounded" id="price" name="price" th:value="${product.price}">
                        <small id="priceError" class="text-red-600 text-sm" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
                    </div>
                    <div class="form-group space-y-2">
                        <label for="initPrice" class="block text-sm font-medium text-gray-700">Initial Price:</label>
                        <input type="number" class="form-control w-full px-3 py-2 border border-gray-300 rounded" id="initPrice" name="initPrice" th:value="${product.initPrice}">
                        <small id="initPriceError" class="text-red-600 text-sm" th:if="${#fields.hasErrors('initPrice')}" th:errors="*{initPrice}"></small>
                    </div>
                    <div class="form-group space-y-2">
                        <label for="sku" class="block text-sm font-medium text-gray-700">SKU:</label>
                        <input type="text" class="form-control w-full px-3 py-2 border border-gray-300 rounded" id="sku" name="sku" th:value="${product.sku}">
                        <small id="skuError" class="text-red-600 text-sm" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></small>
                    </div>
                    <div class="form-group space-y-2">
                        <label for="stock" class="block text-sm font-medium text-gray-700">Stock:</label>
                        <input type="number" class="form-control w-full px-3 py-2 border border-gray-300 rounded" id="stock" name="stock" th:value="${product.stock}">
                        <small id="stockError" class="text-red-600 text-sm" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></small>
                    </div>
                    <div class="form-group space-y-2">
                        <label for="totalSold" class="block text-sm font-medium text-gray-700">Total Sold:</label>
                        <input type="number" class="form-control w-full px-3 py-2 border border-gray-300 rounded" id="totalSold" name="totalSold" th:value="${product.totalSold}">
                        <small id="totalSoldError" class="text-red-600 text-sm" th:if="${#fields.hasErrors('totalSold')}" th:errors="*{totalSold}"></small>
                    </div>
                    <div class="flex gap-6 my-4">
                        <div class="flex-grow-1 flex items-center gap-2">
                            <input type="checkbox" id="active" name="active" th:checked="${product.active}" class="form-checkbox h-4 w-4 text-blue-600 rounded border-gray-300">
                            <label for="active" class="text-sm font-medium text-gray-700">Active</label>
                        </div>
                        <div class="flex-grow-1 flex items-center gap-2">
                            <input type="checkbox" id="enabled" name="enabled" th:checked="${product.enabled}" class="form-checkbox h-4 w-4 text-blue-600 rounded border-gray-300">
                            <label for="enabled" class="text-sm font-medium text-gray-700">Enabled</label>
                        </div>
                    </div>
                    <div class="form-group space-y-2">
                        <label for="category" class="block text-sm font-medium text-gray-700">Category:</label>
                        <select class="form-control w-full px-3 py-2 border border-gray-300 rounded" id="category" name="category">
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id} == ${product?.category?.id}"></option>
                        </select>
                        <small id="categoryError" class="text-red-600 text-sm" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></small>
                    </div>
                    <div class="form-group space-y-2">
                        <div class="text-sm font-medium text-gray-700 mb-2">Primary Image:</div>
                        <div class="product-images flex gap-4">
                            <div class="image relative group">
                                <img class="img-item w-32 h-32 object-fit-cover rounded border border-gray-300" id="productPrimaryImage" th:src="@{'/admin/images/' + ${product.image}}" src="/static/public/imgs/img1.jpg" th:alt="${product.name}">
                                <button type="button" class="delete-btn absolute top-1 right-1 bg-red-600 text-white rounded-full p-1 hover:bg-red-700" id="changePrimaryImage">Add or Change Product Image</button>
                                <input type="file" id="filePrimaryImage" name="productPrimaryImage" class="hidden">
                                <small id="productPrimaryImageError" class="text-red-600 text-sm mt-1 block" th:if="${#fields.hasErrors('productPrimaryImage')}" th:errors="*{productPrimaryImage}"></small>
                            </div>
                        </div>
                    </div>
                    <div class="form-group space-y-2">
                        <div class="text-sm font-medium text-gray-700 mb-2">Images:</div>
                        <div class="product-images flex gap-4" id="productImages">
                            <div class="image relative" th:each="image : ${product.productImages}" th:data-image="${image.id}">
                                <img class="img-item w-24 h-24 object-fit-cover rounded border border-gray-300" th:src="@{'/admin/images/' + ${image.image}}" src="/static/public/imgs/img1.jpg" th:alt="${image.altText}">
                                <button type="button" class="delete-btn absolute top-1 right-1 bg-red-600 text-white rounded-full p-1 hover:bg-red-700" th:data-delete="${image.id}">
                                    <i class="bi bi-x-circle text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="image-upload mt-4">
                        <div id="dropZone" class="drop-zone border-2 border-dashed border-gray-300 rounded p-6 text-center hover:border-blue-500 hover:bg-gray-50 transition-colors">Drag and drop your image here</div>
                        <input type="file" id="fileInput" name="file" class="hidden">
                    </div>
                    <input type="hidden" id="productId" name="id" th:value="${product.productId}">
                    <div>
                        <button type="submit" class="button-37 px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition-colors">Save Changes</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <footer th:replace="~{admin/fragments/footer::footer}"></footer>
    <script th:inline="javascript">
        const productId = /*[[${product.productId}]]*/ 1;
        let images = [];
    </script>
    <script th:src="@{/public/js/jquery-3.7.1.min.js}" src="../../../static/public/js/jquery-3.7.1.min.js"></script>
    <script th:src="@{/admin/js/product_edit_form.js}" src="../../../static/admin/js/product_edit_form.js"></script>
</body>

</html>
