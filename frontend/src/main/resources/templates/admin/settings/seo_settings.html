<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">SEO Settings</title>
    <link th:href="@{/public/css/tailwind.css}" href="/static/public/css/tailwind.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen">
<div class="page-wrapper">
    <div class="wrapper">
        <main class="content p-6">
            <div class="content-page-container max-w-xl mx-auto">
                <header class="mb-6">
                    <h1 class="text-2xl font-bold text-gray-900">SEO Settings</h1>
                    <nav class="flex flex-wrap gap-4 mt-2">
                        <a href="/admin/settings/general" class="text-sm text-blue-600 hover:underline">General Settings</a>
                        <a href="/admin/settings/payment" class="text-sm text-blue-600 hover:underline">Payment Settings</a>
                        <a href="/admin/settings/shipping" class="text-sm text-blue-600 hover:underline">Shipping Settings</a>
                        <a href="/admin/settings/seo" class="text-sm font-medium text-gray-900">SEO Settings</a>
                    </nav>
                </header>
                <form action="/admin/settings/seo" method="post" class="bg-white p-6 border border-gray-200 rounded shadow-sm space-y-4 settings-form">
                    <div class="form-group">
                        <label for="metaTitle" class="block text-sm font-medium text-gray-700 mb-1">Meta Title:</label>
                        <input type="text" id="metaTitle" name="metaTitle" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="metaDescription" class="block text-sm font-medium text-gray-700 mb-1">Meta Description:</label>
                        <textarea id="metaDescription" name="metaDescription" rows="4" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="metaKeywords" class="block text-sm font-medium text-gray-700 mb-1">Meta Keywords:</label>
                        <input type="text" id="metaKeywords" name="metaKeywords" class="form-control w-full px-3 py-2 border border-gray-300 rounded" required>
                    </div>
                    <div class="form-group">
                        <label for="robotsTxt" class="block text-sm font-medium text-gray-700 mb-1">Robots.txt Content:</label>
                        <textarea id="robotsTxt" name="robotsTxt" rows="6" class="form-control w-full px-3 py-2 border border-gray-300 rounded"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="sitemapUrl" class="block text-sm font-medium text-gray-700 mb-1">Sitemap URL:</label>
                        <input type="url" id="sitemapUrl" name="sitemapUrl" class="form-control w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div class="form-group">
                        <label for="canonicalUrl" class="block text-sm font-medium text-gray-700 mb-1">Canonical URL:</label>
                        <input type="url" id="canonicalUrl" name="canonicalUrl" class="form-control w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div class="form-group">
                        <label for="ogTitle" class="block text-sm font-medium text-gray-700 mb-1">Open Graph Title:</label>
                        <input type="text" id="ogTitle" name="ogTitle" class="form-control w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div class="form-group">
                        <label for="ogDescription" class="block text-sm font-medium text-gray-700 mb-1">Open Graph Description:</label>
                        <textarea id="ogDescription" name="ogDescription" rows="4" class="form-control w-full px-3 py-2 border border-gray-300 rounded"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="ogImage" class="block text-sm font-medium text-gray-700 mb-1">Open Graph Image URL:</label>
                        <input type="url" id="ogImage" name="ogImage" class="form-control w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div class="form-group">
                        <label for="twitterCard" class="block text-sm font-medium text-gray-700 mb-1">Twitter Card Type:</label>
                        <input type="text" id="twitterCard" name="twitterCard" class="form-control w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div class="form-group">
                        <label for="twitterTitle" class="block text-sm font-medium text-gray-700 mb-1">Twitter Title:</label>
                        <input type="text" id="twitterTitle" name="twitterTitle" class="form-control w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div class="form-group">
                        <label for="twitterDescription" class="block text-sm font-medium text-gray-700 mb-1">Twitter Description:</label>
                        <textarea id="twitterDescription" name="twitterDescription" rows="4" class="form-control w-full px-3 py-2 border border-gray-300 rounded"></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition-colors">Save SEO Settings</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
