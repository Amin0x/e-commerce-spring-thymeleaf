<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Edit Product</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../static/css/admin/main.css" rel="stylesheet">
</head>
<body>

<div class="wrapper p-6">
    <aside th:replace="~{admin/fragments/navigation :: navigation}"></aside>
    <main class="content">
        <header th:replace="~{admin/fragments/header :: header}"></header>
    <div class="category-edit max-w-lg">
        <h2 class="text-xl font-bold text-gray-900 mb-6">Edit Category</h2>
        <form id="editForm" method="post" class="space-y-4">
            <input type="hidden" name="id" th:value="${category.id}">
            <div class="input-container">
                <label for="name" class="block text-sm font-medium text-gray-700">Name:</label>
                <input type="text" class="text-input w-full px-3 py-2 border border-gray-300 rounded" id="name" name="name" th:value="${category.name}">
            </div>
            <div class="input-container">
                <label for="description" class="block text-sm font-medium text-gray-700">Description:</label>
                <textarea class="text-input w-full px-3 py-2 border border-gray-300 rounded" id="description" name="description" rows="3" th:text="${category.description}"></textarea>
            </div>
            <div class="input-container flex items-center gap-3">
                <label for="active" class="block text-sm font-medium text-gray-700">Active:</label>
                <input type="checkbox" class="text-input" id="active" name="active" th:checked="${category.active}">
            </div>

            <div class="input-container">
                <label for="category" class="block text-sm font-medium text-gray-700">Parent:</label>
                <select class="text-input w-full px-3 py-2 border border-gray-300 rounded" id="category" name="parent">
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}"
                            th:selected="${category.id} == ${category.id}? 'ture':'false'">
                    </option>
                </select>
            </div>

            <div class="mt-6 w-full max-w-xs min-h-[300px] bg-blue-50 rounded border-2 border-dashed border-blue-300 flex items-center justify-center cursor-pointer"
                 id="imageDropArea">
                <div id="imageView" class="w-full min-h-[300px] flex items-center justify-center flex-col">
                    <span class="text-blue-600 font-medium">Drag & Drop or Click to Upload</span>
                    <img id="previewImage" src="#" alt="Preview" class="mt-2 max-w-full max-h-full hidden">
                </div>
                <input type="file" name="image" id="image" class="hidden" accept="image/*">
            </div>

            <input type="hidden" id="productId" name="id" th:value="${category.id}">
            <button type="submit" class="btn btn-primary w-full px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors" id="buttonSubmit">Save Changes</button>
        </form>
    </div>
    </main>
</div>
<footer th:replace="~{admin/fragments/footer::footer}"></footer>
<script th:src="@{/admin/js/main.js}" src="../../../static/admin/js/main.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        categoriesUploadFile();
        categoriesEditForm();
    });
</script>
</body>
</html>
