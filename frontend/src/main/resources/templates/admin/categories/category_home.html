<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Admin - Categories</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../../static/admin/main.css" rel="stylesheet">
    <style>

    </style>
</head>
<body>
<div class="page-wrapper p-6">
    <div class="wrapper">
        <aside th:replace="~{admin/fragments/navigation :: navigation}"></aside>
        <div class="content">
            <header th:replace="~{admin/fragments/header :: header}"></header>
            <div class="categories-home">
                <div class="mb-6">
                    <a href="/admin/categories/create"><button type="button" class="button-37 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">Create</button></a>
                </div>
                <div class="overflow-x-auto mb-6">
                <table class="w-full text-left border-collapse border border-gray-300">
                    <thead class="bg-gray-100">
                    <tr>
                        <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600"><strong>id</strong></th>
                        <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600"><strong>name</strong></th>
                        <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600"><strong>parent</strong></th>
                        <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600"><strong>desc</strong></th>
                        <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600"><strong>action</strong></th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                    <tr th:each="category : ${categories}" class="hover:bg-gray-50">
                        <td class="px-4 py-2 text-sm" th:text="${category.id}"></td>
                        <td class="px-4 py-2 text-sm" th:text="${category.name}"></td>
                        <td class="px-4 py-2 text-sm" th:text="${category.parent} == null? 'Root' : ${category.parent.name}"></td>
                        <td class="px-4 py-2 text-sm"></td>
                        <td class="px-4 py-2 text-sm flex gap-2">
                            <a th:data-delete="${category.id}" href="#" class="delete-button btn-delete px-3 py-1 bg-red-600 text-white rounded text-xs hover:bg-red-700" title="delete">
                                <i class="fas fa-trash-alt"></i> del
                            </a>
                            <a th:href="@{/admin/categories/edit/} + ${category.id}" href="#" class="btn btn-edit px-3 py-1 bg-blue-600 text-white rounded text-xs hover:bg-blue-700">
                                <i class="fas fa-edit"></i> edit
                            </a>
                            <a th:href="@{/admin/categories/edit/parent/} + ${category.id}" href="#" class="btn btn-sub px-3 py-1 bg-indigo-600 text-white rounded text-xs hover:bg-indigo-700">
                                <i class="fas fa-plus-circle"></i> sub
                            </a>
                            <a data-menu="" href="#" class="btn btn-menu px-3 py-1 bg-gray-600 text-white rounded text-xs hover:bg-gray-700" title="menu">
                                <i class="fas fa-bars"></i> menu
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
                </div>
                <div class="pagination flex justify-center gap-2" th:if="${totalPages > 0}">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link px-3 py-1 border border-gray-300 rounded text-sm th:href="@{/admin/categories(page=${currentPage - 1})}" title="Previous">Previous</a>
                    </li>

                    <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${pageNum == currentPage} ? 'bg-blue-600 text-white' : 'bg-white border border-gray-300'">
                        <a class="page-link px-3 py-1 rounded text-sm" th:href="@{/admin/categories(page=${pageNum})}" th:text="${pageNum + 1}"></a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link px-3 py-1 border border-gray-300 rounded text-sm" th:href="@{/admin/categories(page=${currentPage + 1})}" title="Next">Next</a>
                    </li>
                </ul>
                <div class="container mx-auto p-5" id="createCategoryModel">
                    <div class="mb-2 text-lg font-medium">Create new category</div>
                    <form th:action="@{/admin/categories}" method="post" enctype="application/x-www-form-urlencoded" id="createCategoryForm" class="space-y-3">
                        <div class="input-container">
                            <label for="name" class="block text-sm font-medium text-gray-700">Name:</label>
                            <input type="text" class="text-input w-full px-3 py-2 border border-gray-300 rounded" id="name" name="name" required>
                        </div>
                        <div class="input-container">
                            <label for="description" class="block text-sm font-medium text-gray-700">Description:</label>
                            <textarea class="text-input w-full px-3 py-2 border border-gray-300 rounded" id="description" name="description" required></textarea>
                        </div>

                        <div class="input-container">
                            <label for="parent" class="block text-sm font-medium text-gray-700">Parent Category:</label>
                            <select class="text-input w-full px-3 py-2 border border-gray-300 rounded" id="parent" name="parentId">
                                <option value="">None</option>
                                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                            </select>
                        </div>
                        <div class="mt-3 flex gap-3">
                            <button type="submit" class="button-37 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">Submit</button>
                            <button type="button" class="button-37 px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 transition-colors" id="CancelButton">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer th:replace="~{admin/fragments/footer::footer}"></footer>
</div>
<script>
    categoriesHomePage();
</script>
</body>
</html>
