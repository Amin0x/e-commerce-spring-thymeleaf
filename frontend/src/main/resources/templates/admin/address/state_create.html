<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Add State Form</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        *{
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            text-align: center;
            color: #333;
        }
        label, input, select {
            display: inline-block;
        }

        #cityError, #stateError {
            color: red;
        }
        .am-form-group{
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="am-city-card max-w-sm mx-auto p-6 bg-white border border-gray-300 rounded-lg shadow-sm">
        <h1 class="title text-xl font-bold text-center text-gray-800 mb-6" th:text="${formTitle}">Edit State</h1>
        <form id="cityForm" method="POST" class="space-y-4">
            <input type="hidden" name="stateId" id="stateId" value="${stateId}">
            <div class="am-form-group">
                <label for="name" class="block text-sm font-medium text-gray-700">State Name:</label>
                <input type="text" id="name" name="name" class="w-full px-3 py-2 border border-gray-300 rounded" th:value="${stateName}">
                <div id="nameError" class="text-red-600 text-sm mt-1"></div>
            </div>
            <div class="am-form-group">
                <label for="nameAr" class="block text-sm font-medium text-gray-700">State Name (Arabic):</label>
                <input type="text" id="nameAr" name="nameAr" class="w-full px-3 py-2 border border-gray-300 rounded" th:value="${stateNameAr}">
                <div id="nameArError" class="text-red-600 text-sm mt-1"></div>
            </div>
            <div class="am-form-group">
                <label for="country" class="block text-sm font-medium text-gray-700">Country:</label>
                <select id="country" name="country" class="w-full px-3 py-2 border border-gray-300 rounded">
                    <option value="" disabled selected>Select a Country</option>
                    <option th:each="country : ${countries}" th:value="${country.id}" th:text="${country.name}" th:selected="${country.id} == ${countryId}"></option>
                </select>
                <div id="countryError" class="text-red-600 text-sm mt-1"></div>
            </div>
            <div class="button-submit mt-6">
                <button type="submit" class="button-30 w-full px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition-colors">Add City</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('#cityForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const formData = {
                    name: document.querySelector('#name').value,
                    nameAr: document.querySelector('#nameAr').value,
                    countryId: document.querySelector('#countryId').value,
                    country: document.querySelector('#country').value,
                    id: document.querySelector('#stateId').value
                };

                fetch('/admin/address/state', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    const popover = document.createElement('div');
                    popover.classList.add('popover');
                    popover.textContent = 'City added successfully!';
                    document.querySelector('body').append(popover);
                    setTimeout(() => {
                        popover.style.transition = 'opacity 0.5s';
                        popover.style.opacity = '0';
                        setTimeout(() => popover.remove(), 500);
                    }, 3000);
                    document.querySelector('#cityForm').reset();
                })
                .catch(error => {
                    alert('Error adding city!');
                });

            });
        });
    </script>
</body>
</html>
