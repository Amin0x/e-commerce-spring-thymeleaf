<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title th:text="${pageTitle}">Create User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/public/css/tailwind.css}" href="../../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../../static/admin/main.css" rel="stylesheet">
</head>
<body>
<page-wrapper>
    <div class="wrapper">
        <div th:replace="~{admin/fragments/navigation :: navigation}"></div>
        <main class="content">
            <div class="content-page-container create-user-container create-user-content p-6">
                <h2 class="text-xl font-bold text-gray-900 mb-6">Create New User</h2>
                <form id="createUserForm" class="space-y-4 max-w-md">
                    <div class="input-container">
                        <label for="firstName" class="block text-sm font-medium text-gray-700">First Name:</label>
                        <input type="text" class="text-input w-full px-3 py-2 border border-gray-300 rounded invalid" th:value="${firstName}" name="firstName" id="firstName">
                        <div class="error-message text-red-600 text-sm mt-1 show" id="firstNameError">first name is required</div>
                    </div>
                    <div class="input-container">
                        <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name:</label>
                        <input type="text" class="text-input w-full px-3 py-2 border border-gray-300 rounded" name="lastName" th:value="${lastName}" id="lastName">
                        <div class="error-message text-red-600 text-sm mt-1" id="lastNameError">last name is required</div>
                    </div>
                    <div class="input-container">
                        <div role="lable" class="block text-sm font-medium text-gray-700">Birth Date:</div>
                        <div class="flex gap-2">
                            <div class="flex-grow-1">
                                <select class="text-input w-full px-3 py-2 border border-gray-300 rounded mr-2" name="birthdayDay" id="birthdayDay">
                                    <option value="" disabled selected>Day</option>
                                    <option th:each="day : ${#numbers.sequence(1, 31)}" th:value="${day}" th:text="${day}"></option>
                                </select>
                                <div class="error-message text-red-600 text-sm mt-1" id="birthdayDayError">first name is required</div>
                            </div>
                            <div class="flex-grow-1">
                                <select class="text-input w-full px-3 py-2 border border-gray-300 rounded mr-2" id="birthdayMonth">
                                    <option value="" disabled selected>Month</option>
                                    <option th:each="month, iter : ${monthNames}" th:value="${iter.index + 1}" th:text="${month}"></option>
                                </select>
                                <div class="error-message text-red-600 text-sm mt-1" id="birthdayMonthError">first name is required</div>
                            </div>
                            <div class="flex-grow-1">
                                <select class="text-input w-full px-3 py-2 border border-gray-300 rounded" id="birthdayYear">
                                    <option value="" disabled selected>Year</option>
                                    <option th:each="year : ${#numbers.sequence(1900, 2023)}" th:value="${year}" th:text="${year}"></option>
                                </select>
                                <div class="error-message text-red-600 text-sm mt-1" id="birthdayYearError">first name is required</div>
                            </div>
                        </div>
                    </div>
                    <div class="input-container">
                        <label for="role" class="block text-sm font-medium text-gray-700">Role:</label>
                        <select class="text-input w-full px-3 py-2 border border-gray-300 rounded" th:value="${role}" name="role" id="role">
                            <option value="" disabled selected>Select Role</option>
                            <option value="USER">USER</option>
                            <option value="ADMIN">ADMIN</option>
                            <option value="MODERATOR">MODERATOR</option>
                        </select>
                        <div class="error-message text-red-600 text-sm mt-1" id="roleError">first name is required</div>
                    </div>
                    <div class="input-container">
                        <div class="avatar-lable block text-sm font-medium text-gray-700">Avatar:</div>
                        <input type="file" class="text-input" th:value="${avatar}" id="avatar" accept="image/*" style="display:none;">
                        <button type="button" id="avatarButton" class="avatar-button px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">select image</button>
                    </div>
                    <div class="input-container">
                        <label for="email" class="block text-sm font-medium text-gray-700">Email:</label>
                        <input type="email" class="text-input w-full px-3 py-2 border border-gray-300 rounded" th:value="${email}" name="email" id="email">
                        <div class="error-message text-red-600 text-sm mt-1" id="emailError">first name is required</div>
                    </div>
                    <div class="input-container">
                        <label for="password" class="block text-sm font-medium text-gray-700">Password:</label>
                        <input type="password" class="text-input w-full px-3 py-2 border border-gray-300 rounded" th:value="${password}" name="password" id="password">
                        <div class="error-message text-red-600 text-sm mt-1" id="passwordError">first name is required</div>
                    </div>
                    <div class="input-container">
                        <label for="enabled" class="block text-sm font-medium text-gray-700">Status:</label>
                        <select class="text-input w-full px-3 py-2 border border-gray-300 rounded" id="enabled" th:value="${enabled}" name="enabled">
                            <option value="false" selected>Disabled</option>
                            <option value="true">Enabled</option>
                        </select>
                    </div>
                    <button type="button" id="submitButton" class="btn btn-primary mt-3 w-full px-4 py-2"><i class="fab fa-plus"></i> Create User</button>
                </form>
            </div>
        </main>
    </div>
    <footer th:replace="~{admin/fragments/footer::footer}"></footer>
</page-wrapper>

<script th:src="@{/admin/js/main.js}" src="../../../static/admin/js/main.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function(event) {
        userCreateForm().init();
    });
</script>
</body>
</html>
