<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Document</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../../static/admin/main.css" rel="stylesheet">
    <style>
        .section-row{
            margin-bottom: 30px;
        }
        .top-links{
            margin-bottom: 30px;
        }
        .top-links .link{
            display: inline-block;
        }
        .top-links .link a{
            text-decoration: none;
            color: beige;
            background-color: rgb(14, 44, 33);
            border-radius: 4px;
            margin-inline-end: 8px;
            padding-inline: 12px;
            padding-block: 6px;
        }
        .top-links .link a:hover{
            background-color: rgb(35, 82, 51);
        }
    </style>
</head>

<body>
    <div class="wrapper p-6">
        <nav id="sidebar" th:replace="~{admin/fragments/navigation :: navigation}"></nav>
        <main class="content">
            <div class="cart-container">
                <div class="top-links flex gap-2 mb-6">
                    <div class="link"><a href="#" class="px-3 py-1 text-white bg-gray-800 rounded hover:bg-gray-700">All Carts</a></div>
                    <div class="link"><a href="#" class="px-3 py-1 text-white bg-gray-800 rounded hover:bg-gray-700">link</a></div>
                    <div class="link"><a href="#" class="px-3 py-1 text-white bg-gray-800 rounded hover:bg-gray-700">link</a></div>
                    <div class="link"><a href="#" class="px-3 py-1 text-white bg-gray-800 rounded hover:bg-gray-700">link</a></div>
                    <div class="link"><a href="#" class="px-3 py-1 text-white bg-gray-800 rounded hover:bg-gray-700">link</a></div>
                </div>
                <section class="cart-stats section-row">
                    <div class="cart-state__card bg-white border border-gray-200 rounded p-4 shadow-sm">
                        <p class="title text-sm font-semibold text-gray-600 mb-1">Users</p>
                        <p class="state-val text-xl font-bold text-gray-900"><span th:text="${cartState1}">250</span></p>
                        <p class="sub-value text-sm text-gray-500"><span>this month</span></p>
                    </div>
                    <div class="cart-state__card bg-white border border-gray-200 rounded p-4 shadow-sm">
                        <p class="title text-sm font-semibold text-gray-600 mb-1">Orders</p>
                        <p class="state-val text-xl font-bold text-gray-900"><span th:text="${cartState2}">120</span></p>
                        <p class="sub-value text-sm text-gray-500"><span>this month</span></p>
                    </div>
                    <div class="cart-state__card bg-white border border-gray-200 rounded p-4 shadow-sm">
                        <p class="title text-sm font-semibold text-gray-600 mb-1">Revenue</p>
                        <p class="state-val text-xl font-bold text-gray-900"><span th:text="${cartState3}">$5,000</span></p>
                        <p class="sub-value text-sm text-gray-500"><span>this month</span></p>
                    </div>
                    <div class="cart-state__card bg-white border border-gray-200 rounded p-4 shadow-sm">
                        <p class="title text-sm font-semibold text-gray-600 mb-1">Orders</p>
                        <p class="state-val text-xl font-bold text-gray-900"><span th:text="${cartState4}">120</span></p>
                        <p class="sub-value text-sm text-gray-500"><span>this month</span></p>
                    </div>
                    <div class="cart-state__card bg-white border border-gray-200 rounded p-4 shadow-sm">
                        <p class="title text-sm font-semibold text-gray-600 mb-1">Revenue</p>
                        <p class="state-val text-xl font-bold text-gray-900"><span th:text="${cartState5}">$5,000</span></p>
                        <p class="sub-value text-sm text-gray-500"><span>this month</span></p>
                    </div>
                </section>
                <section class="section-carts section-row">
                    <div class="sec-title"><h2 class="title text-lg font-bold text-gray-800 mb-2">Last 10 Carts</h2></div>
                    <div class="carts box bg-white border border-gray-200 rounded shadow-sm">
                        <div th:if="${carts != null}">
                            <table class="w-full text-left border-collapse border border-gray-300">
                                <thead class="bg-gray-100">
                                    <tr>
                                        <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">ID</th>
                                        <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Total</th>
                                        <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Created</th>
                                        <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Updated</th>
                                        <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Items</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cart : ${carts}" th:if="${cart != null}" class="border-b border-gray-200 last:border-b-0 hover:bg-gray-50">
                                        <td class="px-4 py-2 text-sm" th:text="${cart.id}">123</td>
                                        <td class="px-4 py-2 text-sm" th:text="${cart.total}">4567</td>
                                        <td class="px-4 py-2 text-sm" th:text="${cart.created}">4567</td>
                                        <td class="px-4 py-2 text-sm" th:text="${cart.updated}">4567</td>
                                        <td class="px-4 py-2 text-sm" th:text="${#lists.size(cart.cartItems)}">4567</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:unless="${carts != null}">
                            <div class="sec-title"><p class="title text-gray-500 text-sm text-center py-4">No Carts Found</p></div>
                        </div>
                    </div>
                </section>
                <section class="section-row" style="margin-bottom: 1.2rem;">
                    <div class="summary flex flex-col sm:flex-row gap-4">
                        <div class="card flex-1 bg-white border border-gray-200 rounded p-4 shadow-sm">
                            <p class="title text-sm font-semibold text-gray-600 mb-2">Total Carts</p>
                            <hr class="border-gray-200 mb-2">
                            <p><span class="text-lg font-bold text-gray-900" th:text="${totalCarts}"></span></p>
                        </div>
                        <div class="card flex-1 bg-white border border-gray-200 rounded p-4 shadow-sm">
                            <p class="title text-sm font-semibold text-gray-600 mb-2">Total Price</p>
                            <hr class="border-gray-200 mb-2">
                            <p><span class="text-lg font-bold text-gray-900" th:text="${totalPrice}"></span></p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
        <!-- Footer -->
    </div>
    <footer th:replace="~{admin/fragments/footer::footer}"></footer>

</body>
</html>
