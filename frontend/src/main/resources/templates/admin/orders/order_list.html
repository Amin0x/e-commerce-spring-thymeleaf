<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Document</title>
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/admin/main.css}" href="../../../static/admin/main.css" rel="stylesheet">
<style>
    .content-page-container {
        padding: 20px;
        background-color: #f8f9fa;
    }
</style>
</head>
<body class="p-6">
    <div class="page-wrapper">
        <div class="wrapper">
            <aside th:replace="~{admin/fragments/navigation :: navigation}"></aside>
            <main class="content">
                <div class="content-page-container order-list-page">
                    <h2 class="title text-2xl font-bold text-gray-900 mb-6">Orders List</h2>
                    <div class="shortcut-container flex flex-wrap gap-2 mb-6">
                        <a th:href="@{/admin/orders/list}" class="shortcut px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">View All Orders</a>
                        <a th:href="@{/admin/orders/new}" class="shortcut px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Create New Order</a>
                        <a th:href="@{/admin/orders/pending}" class="shortcut px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Pending Orders</a>
                        <a th:href="@{/admin/orders/completed}" class="shortcut px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Completed Orders</a>
                        <a th:href="@{/admin/orders/reports}" class="shortcut px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Order Reports</a>
                    </div>
                    <div class="overflow-x-auto">
                    <table class="table table-bordered w-full text-left border-collapse border border-gray-300">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Order ID</th>
                                <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Customer Name</th>
                                <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Order Date</th>
                                <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Status</th>
                                <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Total</th>
                                <th class="px-4 py-2 border border-gray-300 text-sm font-semibold text-gray-600">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <tr th:each="order : ${orders}" class="border-b border-gray-200 last:border-b-0 hover:bg-gray-50">
                                <td class="px-4 py-2 text-sm" th:text="${order.id}"></td>
                                <td class="px-4 py-2 text-sm">
                                    <a th:href="@{/admin/customers/{id}(id=${order.customer?.id})}" class="text-blue-600 hover:underline" th:text="|${order.customer?.firstName} ${order.customer?.lastName}|"></a>
                                </td>
                                <td class="px-4 py-2 text-sm" th:text="${order.orderDate}"></td>
                                <td class="px-4 py-2 text-sm" th:text="${order.status}"></td>
                                <td class="px-4 py-2 text-sm" th:text="${order.totalAmount}"></td>
                                <td class="px-4 py-2 text-sm flex gap-2">
                                    <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="px-3 py-1 bg-red-600 text-white rounded text-xs hover:bg-red-700">Details</a>
                                    <a th:href="@{/admin/orders/delete/{id}(id=${order.id})}" class="px-3 py-1 bg-red-700 text-white rounded text-xs hover:bg-red-800">Delete</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    </div>
                    <div class="d-flex justify-content-center mt-6 justify-center">
                        <nav aria-label="Page navigation">
                            <ul class="pagination flex gap-1">
                                <li class="page-item" th:classappend="${pageNumber == 1} ? 'disabled'">
                                    <a class="page-link px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50" th:href="@{/admin/orders/list(page=${pageNumber - 1})}" aria-label="Previous">
                                        <span aria-hidden="true">&laquo;</span>
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == pageNumber} ? 'bg-blue-600 text-white' : 'border border-gray-300 rounded text-sm'">
                                    <a class="page-link px-3 py-1 hover:bg-gray-50" th:href="@{/admin/orders/list(page=${i})}" th:text="${i}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${pageNumber == totalPages} ? 'disabled'">
                                    <a class="page-link px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50" th:href="@{/admin/orders/list(page=${pageNumber + 1})}" aria-label="Next">
                                        <span aria-hidden="true">&raquo;</span>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
