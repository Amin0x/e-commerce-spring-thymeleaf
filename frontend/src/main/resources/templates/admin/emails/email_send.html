<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" th:content="${pageAuthor}" />
    <meta name="description" th:content="${pageDescription}" />
    <title th:text="${pageTitle}">Send Email</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.18/summernote-bs4.min.css">
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
</head>
<body>
    <div class="container mx-auto mt-8 px-4">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Send Email</h2>
        <form action="/send-email" method="post" class="max-w-xl space-y-4">
            <div class="form-group">
                <label for="to" class="block text-sm font-medium text-gray-700 mb-1">To:</label>
                <input type="email" class="form-control w-full px-3 py-2 border border-gray-300 rounded" id="to" name="to" required>
            </div>
            <div class="form-group">
                <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Subject:</label>
                <input type="text" class="form-control w-full px-3 py-2 border border-gray-300 rounded" id="subject" name="subject" required>
            </div>
            <div class="form-group">
                <label for="body" class="block text-sm font-medium text-gray-700 mb-1">Body:</label>
                <textarea class="form-control w-full" id="summernote" name="body" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-full px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">Send</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js'}" src="../../../static/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.18/summernote-bs4.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#summernote').summernote({
                height: 300
            });

        $('form').on("submit",function(e) {
            var summernoteContent = $('#summernote').summernote('code');
            $('#summernote').html(summernoteContent);
            const v = $('#summernote').val(summernoteContent);
            e.preventDefault();
            $.ajax({
                url: '/admin/send-email',
                type: 'post',
                data: $('form').serialize(),
                success: function() {
                    alert('Email sent successfully');
                }
            });
        });
    });
    </script>
</body>
</html>
