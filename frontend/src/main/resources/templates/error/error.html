<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="Error" th:content="${description}">
    <meta name="author" content="AMIN" th:content="${author}">
    <meta name="keywords" content="ERROR" th:content="${keywords}">

    <title th:text="${title}">Error</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link th:href="@{/public/css/tailwind.css}" href="../../static/public/css/tailwind.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="../../static/public/css/style.css" rel="stylesheet" >
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="max-w-md">
        <h1 class="text-6xl font-bold text-gray-900 mb-2" th:text="${status}">Error</h1>
        <p class="lead text-xl text-gray-800 mb-4" th:text="${message}">Oops! Something went wrong.</p>
        <a href="/" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors font-medium inline-flex items-center gap-2"><i class="fas fa-home"></i> Go to Homepage</a>
    </div>
</body>
</html>
